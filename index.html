<script>
  let deferredPrompt = null;
  const installBtn = document.getElementById("pwaInstallBtn");
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
  });
  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    installBtn.style.display = "none";
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  });
  window.addEventListener("appinstalled", () => {
    installBtn.style.display = "none";
  });
</script>

// ---------------- sound engine (synthesized, no assets needed) ----------------
let audioCtx = null;
const getCtx = () => {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
};
const tone = (freq, start, dur, type = "sine", gain = 0.09, endFreq = null) => {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
  if (endFreq) {
    osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + start + dur);
  }
  g.gain.setValueAtTime(0, ctx.currentTime + start);
  g.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + dur + 0.05);
};

const sounds = {
  done: () => { 
    tone(523.25, 0, 0.12, "sine", 0.08); 
    tone(659.25, 0.05, 0.12, "sine", 0.08); 
    tone(783.99, 0.1, 0.2, "sine", 0.07); 
    tone(1046.50, 0.15, 0.35, "sine", 0.06); 
  },
  undone: () => tone(400, 0, 0.15, "sine", 0.06, 250),
  add: () => { tone(500, 0, 0.08, "sine", 0.05); tone(800, 0.06, 0.12, "sine", 0.06); },
  remove: () => { tone(600, 0, 0.08, "triangle", 0.04, 300); tone(400, 0.05, 0.1, "triangle", 0.04, 200); },
  click: () => tone(800, 0, 0.06, "sine", 0.05, 300),
  pomodoro: () => { tone(880, 0, 0.6, "sine", 0.07); tone(1108.73, 0, 0.6, "sine", 0.07); tone(1318.51, 0, 0.8, "sine", 0.06); },
  comment: () => { tone(700, 0, 0.05, "sine", 0.04, 500); tone(900, 0.07, 0.05, "sine", 0.04, 700); },
  celebrate: () => { [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((f, i) => tone(f, i * 0.06, 0.25, "sine", 0.07)); },
  error: () => { tone(300, 0, 0.15, "sawtooth", 0.04, 250); }
};

// Reusable segmented tab bar with an animated sliding thumb (English-Hub style)
function SlidingTabBar({ tabs, active, onChange }) {
  const containerRef = React.useRef(null);
  const btnRefs = React.useRef({});
  const [thumb, setThumb] = useState({ left: 0, width: 0 });

  const measure = () => {
    const el = btnRefs.current[active];
    const container = containerRef.current;
    if (el && container) {
      const cRect = container.getBoundingClientRect();
      const bRect = el.getBoundingClientRect();
      setThumb({ left: bRect.left - cRect.left, width: bRect.width });
    }
  };

  useEffect(() => {
    measure();
    const onResize = () => measure();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
    // eslint-disable-next-line
  }, [active, tabs.length]);

  return (
    <div ref={containerRef} className="wf-sliding-tabs">
      <div className="wf-sliding-thumb" style={{ left: thumb.left, width: thumb.width }} />
      {tabs.map((t) => (
        <button key={t.id} ref={(el) => (btnRefs.current[t.id] = el)}
          className={`wf-sliding-tab${active === t.id ? " active" : ""}`}
          onClick={() => onChange(t.id)}>
          {t.label}
        </button>
      ))}
    </div>
  );
}

function useFocusStats(focusLog) {
  return useMemo(() => {
    let sessionsToday = 0;
    let totalMinutesToday = 0;
    const last7 = [];
    
    for (let i = 6; i >= 0; i--) {
      const d = new Date(todayStr);
      d.setDate(d.getDate() - i);
      last7.push({
        date: d.toISOString().split("T")[0],
        day: ["CN", "T2", "T3", "T4", "T5", "T6", "T7"][d.getDay()],
        minutes: 0
      });
    }

    const uniqueDays = new Set();
    
    focusLog.forEach(l => {
      if (l.type === "work") {
        uniqueDays.add(l.date);
        if (l.date === todayStr) {
          sessionsToday++;
          totalMinutesToday += l.minutes;
        }
        const dayEntry = last7.find(d => d.date === l.date);
        if (dayEntry) {
          dayEntry.minutes += l.minutes;
        }
      }
    });

    let streak = 0;
    const sortedDates = Array.from(uniqueDays).sort().reverse();
    let currentDate = new Date(todayStr);
    
    if (sortedDates.length > 0) {
      if (sortedDates[0] === todayStr || sortedDates[0] === new Date(currentDate.setDate(currentDate.getDate() - 1)).toISOString().split("T")[0]) {
        currentDate = new Date(sortedDates[0]);
        for (const dStr of sortedDates) {
          if (dStr === currentDate.toISOString().split("T")[0]) {
            streak++;
            currentDate.setDate(currentDate.getDate() - 1);
          } else {
            break;
          }
        }
      }
    }

    return { sessionsToday, totalMinutesToday, streak, last7 };
  }, [focusLog]);
}

const formatFileSize = (bytes) => {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
};

const hexToRgba = (hex, alpha) => {
  const h = hex.replace("#", "");
  const r = parseInt(h.length === 3 ? h[0] + h[0] : h.slice(0, 2), 16);
  const g = parseInt(h.length === 3 ? h[1] + h[1] : h.slice(2, 4), 16);
  const b = parseInt(h.length === 3 ? h[2] + h[2] : h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
};

  }
  const colors = ["#6366f1", "#10b981", "#f97316", "#ec4899", "#a855f7", "#eab308", "#06b6d4", "#ef4444"];
  let hash = 0;
  for(let i=0; i<projName.length; i++) hash = projName.charCodeAt(i) + ((hash << 5) - hash);
  hash = Math.abs(hash);
  const hex = colors[hash % colors.length];

};

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onAuthed(data.session);

        const { data, error } = await supabase.auth.signUp({
          email, password, options: { data: { name: name || email.split("@")[0] } },

            <input value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="Nhập mã mời (VD: A1B2C3)"
              style={{ width: "100%", padding: "10px 12px", marginBottom: 10, borderRadius: 10, border: "1px solid #e2e8f0", boxSizing: "border-box" }} />
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={joinWorkspace} style={{ flex: 1, padding: 10, borderRadius: 10, border: "none", background: "#4f46e5", color: "#fff", fontWeight: 700, cursor: "pointer" }}>Tham gia</button>
              <button onClick={() => setJoining(false)} style={{ padding: 10, borderRadius: 10, border: "1px solid #e2e8f0", background: "#fff", cursor: "pointer" }}>Hủy</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------------- Root gate: Auth -> tự động tạo/lấy workspace -> App ----------------
function RootGate() {
  const [session, setSession] = useState(undefined); // undefined = loading, null = logged out
  const [workspace, setWorkspace] = useState(null);
  const [settingUp, setSettingUp] = useState(false);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabase.auth.onAuthStateChange((_event, sess) => {
      setSession(sess);
      if (!sess) setWorkspace(null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  // Tự động lấy workspace có sẵn của user, hoặc tạo mới nếu chưa có — không hiện màn hình chọn
  useEffect(() => {
    if (!session || workspace) return;
    let cancelled = false;
    (async () => {
      setSettingUp(true);
      const { data: memberships } = await supabase
        .from("workspace_members")
        .select("workspaces(id, name, invite_code)")
        .eq("user_id", session.user.id)
        .limit(1);
      if (!cancelled && memberships && memberships.length && memberships[0].workspaces) {
        setWorkspace(memberships[0].workspaces);
        setSettingUp(false);
        return;
      }
      const displayName = session.user.user_metadata?.name || session.user.email.split("@")[0];
      const invite_code = genInviteCode();
      const { data: ws, error } = await supabase.from("workspaces")
        .insert({ name: `Nhóm của ${displayName}`, invite_code, owner_id: session.user.id }).select().single();
      if (!error && ws) {
        await supabase.from("workspace_members").insert({ workspace_id: ws.id, user_id: session.user.id, role: "owner" });
        if (!cancelled) setWorkspace(ws);
      }
      if (!cancelled) setSettingUp(false);
    })();
    return () => { cancelled = true; };
  }, [session, workspace]);

  if (session === undefined || (session && !workspace)) {
    return <div style={{ minHeight: "100dvh", display: "flex", alignItems: "center", justifyContent: "center" }}>Đang tải...</div>;
  }
  if (!session) return <AuthScreen onAuthed={setSession} />;
  return <WorkFlowProApp session={session} workspace={workspace} onSwitchWorkspace={setWorkspace} />;
}

const mergeBy = (local, remote, key = "id") => {
  if (!local) return remote || [];
  if (!remote) return local || [];
  const map = new Map(remote.map(i => [i[key], i]));
  local.forEach(i => map.set(i[key], i));
  return Array.from(map.values());
};

const mergeLog = (local, remote) => {
  const map = new Map((remote || []).map(i => [i.date, i]));
  (local || []).forEach(i => map.set(i.date, i));
  return Array.from(map.values()).sort((a,b) => b.date - a.date);
};

export default function WorkFlowProApp({ session, workspace, onSwitchWorkspace }) {
  const [currentUser, setCurrentUser] = useState(() => {
    const meta = session?.user?.user_metadata || {};

    return { id: session?.user?.id, name: displayName, avatar: displayName[0].toUpperCase(), status: "Online", friendCode };
  });
  const [tasks, setTasks] = useState(seedTasks);
  const [confirmConvert, setConfirmConvert] = useState(null);
  const [mobileOpen, setMobileOpen] = useState(false);
  const [active, setActive] = useState("Bảng Điều Khiển");
  const [modalOpen, setModalOpen] = useState(false);
  const [modalStep, setModalStep] = useState("choose");
  const [newType, setNewType] = useState("personal");
  const [form, setForm] = useState({ title: "", due: "", owner: "Bạn", project: "Việc lẻ", priority: "Vừa", desc: "", subtasks: [], workTime: "" });
  const [modalSubDraft, setModalSubDraft] = useState("");
  const [toast, setToast] = useState(null);
  const [detailTaskId, setDetailTaskId] = useState(null);
  const [commentDraft, setCommentDraft] = useState("");
  const [pomodoro, setPomodoro] = useState(null); // {taskId, secondsLeft}
  const [filter, setFilter] = useState("Hôm nay");
  const [quickAdd, setQuickAdd] = useState("");
  const [showTeam, setShowTeam] = useState(true);
  const [openProjectId, setOpenProjectId] = useState(null);
  const [showNotifs, setShowNotifs] = useState(false);
  const [showFriends, setShowFriends] = useState(false);
  const [notifs, setNotifs] = useState([]);

  const [projectTab, setProjectTab] = useState("kanban");
  const [soundOn, setSoundOn] = useState(true);
  const [darkMode, setDarkMode] = useState(false);
  const [celebrate, setCelebrate] = useState(false);
  const [collapsed, setCollapsed] = useState({});
  const [todaySortMode, setTodaySortMode] = useState("time");
  const [projects, setProjects] = useState([...seedPersonalProjects.map(p => ({...p, type: 'personal'})), ...seedGroupProjects.map(p => ({...p, type: 'team'}))]);
  const [friends, setFriends] = useState(seedFriends);
  const [habits, setHabits] = useState(seedHabits);
  const [members, setMembers] = useState(seedMembers);
  const [teamQuickAdd, setTeamQuickAdd] = useState("");
  const [newSubtaskDraft, setNewSubtaskDraft] = useState({});

  // ---------------- focus timer (Pomodoro) ----------------
  const [focusSettings, setFocusSettings] = useState({ work: 25, short: 5, long: 15, longEvery: 4, autoFlow: false });
  const [focusTimer, setFocusTimer] = useState({ mode: "work", secondsLeft: 25 * 60, running: false, cycleCount: 0, taskId: null });
  const [zenMode, setZenMode] = useState(false);
  const [focusLog, setFocusLog] = useState(seedFocusLog);
  const [reflectId, setReflectId] = useState(null);
  const [pomoStats, setPomoStats] = useState({ streak: 0, lastDate: null, totalSessions: 0, xp: 0, level: 1 });
  const [surprise, setSurprise] = useState(null);
  // ==================== SUPABASE SYNC (tối ưu real-time) ====================
  const [syncReady, setSyncReady] = useState(false);
  const [connectionStatus, setConnectionStatus] = useState("connecting"); // "connected" | "connecting" | "disconnected"
  const [onlineUsers, setOnlineUsers] = useState([]);
  const [stickyNote, setStickyNote] = useState("");
  const [events, setEvents] = useState([]);
  const skipNextSave = useRef(false);
  const saveTimer = useRef(null);
  const lastSaveTime = useRef(0);
  const pendingSave = useRef(false);
  const dataVersion = useRef(0);
  const channelRef = useRef(null);
  const presenceRef = useRef(null);

  // --- 1. Tải dữ liệu ban đầu từ Supabase ---
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data, error } = await supabase
        .from("workspace_state")
        .select("data")
        .eq("workspace_id", workspace.id)
        .maybeSingle();
      if (cancelled) return;
      if (!error && data && data.data) {
        const d = data.data;
        skipNextSave.current = true;
        if (d.tasks) setTasks(d.tasks);
        if (d.projects) setProjects(d.projects);
        if (d.habits) setHabits(d.habits);
        if (d.members) setMembers(d.members);
        if (d.friends) setFriends(d.friends);
        if (d.notifs) setNotifs(d.notifs);
        if (d.stickyNote !== undefined) setStickyNote(d.stickyNote);
        if (d.events) setEvents(d.events);
        if (d.pomoStats) setPomoStats(d.pomoStats);
        if (d.focusSettings) setFocusSettings(d.focusSettings);
        if (d.settings) {
          if (d.settings.soundOn !== undefined) setSoundOn(d.settings.soundOn);
          if (d.settings.darkMode !== undefined) setDarkMode(d.settings.darkMode);
          if (d.settings.showTeam !== undefined) setShowTeam(d.settings.showTeam);
          if (d.settings.todaySortMode !== undefined) setTodaySortMode(d.settings.todaySortMode);
          if (d.settings.projectTab !== undefined) setProjectTab(d.settings.projectTab);
          if (d.settings.filter !== undefined) setFilter(d.settings.filter);
        }
        if (d._version) dataVersion.current = d._version;
      }
      setSyncReady(true);
    })();
    return () => { cancelled = true; };
  }, [workspace.id]);

  // --- 2. Kênh Realtime: postgres_changes ---
  useEffect(() => {
    const channel = supabase
      .channel(`workspace_${workspace.id}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "workspace_state", filter: `workspace_id=eq.${workspace.id}` },
        (payload) => {
          const row = payload.new;
          if (!row || row.updated_by === CLIENT_ID) return;
          const d = row.data || {};
          
          if (pendingSave.current) {
            // Local changes are pending, perform intelligent merge to preserve them
            if (d._version) dataVersion.current = Math.max(dataVersion.current, d._version);
            if (d.tasks) setTasks(prev => mergeBy(prev, d.tasks, "id"));
            if (d.projects) setProjects(prev => mergeBy(prev, d.projects, "id"));
            if (d.habits) setHabits(prev => mergeBy(prev, d.habits, "name"));
            if (d.members) setMembers(prev => mergeBy(prev, d.members, "name"));
            if (d.events) setEvents(prev => mergeBy(prev, d.events, "id"));
            if (d.notifs) setNotifs(prev => mergeBy(prev, d.notifs, "id"));
            if (d.friends) setFriends(prev => mergeBy(prev, d.friends, "id"));
            if (d.focusLog) setFocusLog(prev => mergeLog(prev, d.focusLog));
            // Keep remote state for primitives since they can't be easily merged
            if (d.stickyNote !== undefined) setStickyNote(d.stickyNote);
            if (d.pomoStats) setPomoStats(d.pomoStats);
            if (d.focusSettings) setFocusSettings(d.focusSettings);
          } else {
            // Safe to overwrite local state
            skipNextSave.current = true;
            if (d._version) dataVersion.current = Math.max(dataVersion.current, d._version);
            if (d.tasks) setTasks(d.tasks);
            if (d.projects) setProjects(d.projects);
            if (d.habits) setHabits(d.habits);
            if (d.members) setMembers(d.members);
            if (d.friends) setFriends(d.friends);
            if (d.focusLog) setFocusLog(d.focusLog);
            if (d.notifs) setNotifs(d.notifs);
            if (d.stickyNote !== undefined) setStickyNote(d.stickyNote);
            if (d.events) setEvents(d.events);
            if (d.pomoStats) setPomoStats(d.pomoStats);
            if (d.focusSettings) setFocusSettings(d.focusSettings);
            if (d.settings) {
              if (d.settings.soundOn !== undefined) setSoundOn(d.settings.soundOn);
              if (d.settings.darkMode !== undefined) setDarkMode(d.settings.darkMode);
              if (d.settings.showTeam !== undefined) setShowTeam(d.settings.showTeam);
              if (d.settings.todaySortMode !== undefined) setTodaySortMode(d.settings.todaySortMode);
              if (d.settings.projectTab !== undefined) setProjectTab(d.settings.projectTab);
              if (d.settings.filter !== undefined) setFilter(d.settings.filter);
            }
          }
        })
      .subscribe((status) => {
        if (status === "SUBSCRIBED") {
          setConnectionStatus("connected");
        } else if (status === "CLOSED" || status === "CHANNEL_ERROR") {
          setConnectionStatus("disconnected");
        } else {
          setConnectionStatus("connecting");
        }
      });
    channelRef.current = channel;
    return () => { supabase.removeChannel(channel); };
  }, [workspace.id]);

  // --- 2b. Global Presence (Trạng thái Online Toàn cầu) ---
  useEffect(() => {
    const presenceChannel = supabase
      .channel('global_presence', {
        config: { presence: { key: currentUser.id } }
      })
      .on("presence", { event: "sync" }, () => {
        const state = presenceChannel.presenceState();
        const users = Object.values(state).flat().map(u => ({
          id: u.user_id,
          name: u.user_name,
          online_at: u.online_at,
          friendCode: u.friend_code
        }));
        setOnlineUsers(users);
      })
      .on("broadcast", { event: "friend_req" }, (payload) => {
        if (payload.payload.toCode === currentUser.friendCode) {
          setNotifs(prev => [{
            id: 'notif_'+Date.now(),
            icon: '👋',
            text: `<strong>${payload.payload.fromName}</strong> muốn kết bạn với bạn.`,
            time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
            read: false,
            reqFromCode: payload.payload.fromCode,
            reqFromName: payload.payload.fromName
          }, ...prev]);
        }
      })
      .on("broadcast", { event: "friend_accept" }, (payload) => {
        if (payload.payload.toCode === currentUser.friendCode) {
          setFriends(prev => {
            if (prev.find(f => f.friendCode === payload.payload.fromCode)) return prev;
            return [...prev, { id: 'f'+Date.now(), name: payload.payload.fromName, friendCode: payload.payload.fromCode, avatarColor: '#10b981' }];
          });
          showToast(`${payload.payload.fromName} đã chấp nhận lời mời kết bạn!`);
        }
      })
      .subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await presenceChannel.track({
            user_id: currentUser.id,
            user_name: currentUser.name,
            friend_code: currentUser.friendCode,
            online_at: new Date().toISOString()
          });
        }
      });
    presenceRef.current = presenceChannel;
    return () => { supabase.removeChannel(presenceChannel); };
  }, [currentUser.id, currentUser.name, currentUser.friendCode]);

  // --- 3. Tự động reconnect khi tab focus lại (tối ưu mobile/tab switching) ---
  useEffect(() => {
    const handleVisibility = () => {
      if (document.visibilityState === "visible") {
        if (channelRef.current) {
          const state = channelRef.current.state;
          if (state === "closed" || state === "errored") channelRef.current.subscribe();
        }
        if (presenceRef.current) {
          const state = presenceRef.current.state;
          if (state === "closed" || state === "errored") presenceRef.current.subscribe();
          else presenceRef.current.track({
            user_id: currentUser.id,
            user_name: currentUser.name,
            friend_code: currentUser.friendCode,
            online_at: new Date().toISOString()
          });
        }
      }
    };
    document.addEventListener("visibilitychange", handleVisibility);
    return () => document.removeEventListener("visibilitychange", handleVisibility);
  }, [currentUser.id, currentUser.name, currentUser.friendCode]);

  // --- 4. Debounced Save với adaptive throttle (nhanh hơn khi thay đổi ít, chậm hơn khi thay đổi liên tục) ---
  useEffect(() => {
    if (!syncReady) return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }

    const now = Date.now();
    const timeSinceLastSave = now - lastSaveTime.current;
    const delay = timeSinceLastSave < 500 ? 800 : 300; // adaptive: thay đổi liên tục → chờ lâu hơn, thay đổi đơn lẻ → lưu nhanh

    if (saveTimer.current) clearTimeout(saveTimer.current);
    pendingSave.current = true;

    saveTimer.current = setTimeout(async () => {
      dataVersion.current += 1;
      const saveData = { 
        tasks, projects, habits, members, friends, focusLog, notifs, stickyNote, events, 
        pomoStats, focusSettings, settings: { soundOn, darkMode, showTeam, todaySortMode, projectTab, filter }, 
        _version: dataVersion.current 
      };
      await supabase.from("workspace_state").upsert({
        workspace_id: workspace.id,
        data: saveData,
        updated_by: CLIENT_ID,
        updated_at: new Date().toISOString(),
      });
      lastSaveTime.current = Date.now();
      pendingSave.current = false;
    }, delay);

    return () => clearTimeout(saveTimer.current);
  }, [tasks, projects, habits, members, friends, focusLog, notifs, stickyNote, events, pomoStats, focusSettings, soundOn, darkMode, showTeam, todaySortMode, projectTab, filter, syncReady, workspace.id]);

  // --- 5. Lưu dữ liệu trước khi đóng tab (beforeunload) ---
  useEffect(() => {
    const handleBeforeUnload = () => {
      if (pendingSave.current && syncReady) {
        dataVersion.current += 1;
        const blob = new Blob([JSON.stringify({
          workspace_id: workspace.id,
          data: { 
            tasks, projects, habits, members, friends, focusLog, notifs, stickyNote, events, 
            pomoStats, focusSettings, settings: { soundOn, darkMode, showTeam, todaySortMode, projectTab, filter }, 
            _version: dataVersion.current 
          },
          updated_by: CLIENT_ID,
          updated_at: new Date().toISOString(),
        })], { type: "application/json" });
        navigator.sendBeacon && navigator.sendBeacon(
          `${SUPABASE_URL}/rest/v1/workspace_state?on_conflict=workspace_id`,
          blob
        );
      }
    };
    window.addEventListener("beforeunload", handleBeforeUnload);
    return () => window.removeEventListener("beforeunload", handleBeforeUnload);
  }, [tasks, projects, habits, members, friends, focusLog, notifs, stickyNote, events, pomoStats, focusSettings, soundOn, darkMode, showTeam, todaySortMode, projectTab, filter, syncReady, workspace.id]);

  useEffect(() => {
    if (!focusTimer.running) return;
    const id = setInterval(() => {
      setFocusTimer((f) => {
        if (f.secondsLeft > 0) {
          if (f.secondsLeft <= 4 && f.secondsLeft > 1) {
            playSound("click", soundOn);
          }
          return { ...f, secondsLeft: f.secondsLeft - 1 };
        }
        return f;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [focusTimer.running, soundOn]);

  useEffect(() => {
    if (focusTimer.running && focusTimer.secondsLeft === 0) {
      completeFocusSession();
    }
    // eslint-disable-next-line
  }, [focusTimer.secondsLeft]);

  const focusModeMinutes = (mode) => focusSettings[mode === "work" ? "work" : mode === "short" ? "short" : "long"];

  const completeFocusSession = () => {
    playSound(focusTimer.mode === "work" ? "celebrate" : "pomodoro", soundOn);
    const minutes = focusModeMinutes(focusTimer.mode);
    const newId = "f" + Date.now();
    const entry = {
      id: newId, date: todayStr, type: focusTimer.mode, minutes,
      taskTitle: focusTimer.taskId ? (tasks.find((t) => t.id === focusTimer.taskId)?.title || "") : "",
      completedAt: new Date().toISOString(),
      rating: 0, done: "", difficulty: "", solution: "", tag: "", nextStep: ""
    };
    setFocusLog((log) => [entry, ...log]);

    if (focusTimer.mode === "work") {
      setReflectId(newId);
      
      // Calculate XP and Streak
      setPomoStats(prev => {
        const d = new Date(todayStr);
        d.setDate(d.getDate() - 1);
        const yesterdayStr = d.toISOString().split('T')[0];
        
        let newStreak = prev.streak;
        if (prev.lastDate === yesterdayStr) newStreak += 1;
        else if (prev.lastDate !== todayStr) newStreak = 1;
        else newStreak = prev.streak === 0 ? 1 : prev.streak; // if today and 0 somehow
        
        let newXp = prev.xp + 50;
        let newLevel = prev.level;
        if (newXp >= newLevel * 100) {
          newXp -= newLevel * 100;
          newLevel += 1;
          showToast(`🎉 Chúc mừng! Bạn đã đạt Cấp độ ${newLevel}!`);
        }
        
        return { ...prev, streak: newStreak, lastDate: todayStr, totalSessions: prev.totalSessions + 1, xp: newXp, level: newLevel };
      });
      
      // Surprise Trigger (80% chance)
      if (Math.random() < 0.8) {
        const surprises = [
          { type: "quote", title: "Món quà bất ngờ!", content: "Một hành trình vạn dặm bắt đầu từ một bước chân. Bạn đang làm rất tốt!" },
          { type: "badge", title: "Huy hiệu hiếm!", content: "🎖️ Kẻ hủy diệt Deadline" },
          { type: "tip", title: "Phần thưởng nhỏ", content: "Hãy đứng lên vươn vai và uống 1 ngụm nước lớn nhé!" },
          { type: "quote", title: "Thông điệp vũ trụ", content: "Đừng so sánh mình với người khác, hãy so sánh mình của ngày hôm nay với hôm qua." },
          { type: "badge", title: "Thành tựu ẩn!", content: "🔥 Kẻ cuồng việc" },
          { type: "tip", title: "Mát-xa mắt", content: "Hãy nhắm mắt lại 10 giây và massage nhẹ quanh mắt." },
          { type: "quote", title: "Chút lửa động lực", content: "Kỷ luật là chiếc cầu nối giữa mục tiêu và thành tựu." },
          { type: "badge", title: "Danh hiệu mới!", content: "🧘 Thiền sư tập trung" },
          { type: "tip", title: "Vận động nhẹ", content: "Đi bộ 1 vòng quanh phòng hoặc vươn vai thật căng." },
          { type: "quote", title: "Thở phào nhẹ nhõm", content: "Hãy làm những gì bạn có thể, với những gì bạn có, ở ngay nơi bạn đang đứng." },
          { type: "tip", title: "Hít thở sâu", content: "Hít vào 4 giây, giữ 4 giây, thở ra 4 giây." }
        ];
        setSurprise(surprises[focusTimer.cycleCount % surprises.length]);
      }
    } else {
      // Break over - XP
      setPomoStats(prev => {
        let newXp = prev.xp + 10;
        let newLevel = prev.level;
        if (newXp >= newLevel * 100) {
          newXp -= newLevel * 100;
          newLevel += 1;
        }
        return { ...prev, xp: newXp, level: newLevel };
      });
    }

    const nextCycle = focusTimer.mode === "work" ? focusTimer.cycleCount + 1 : focusTimer.cycleCount;
    const nextMode = focusTimer.mode === "work" ? (nextCycle % focusSettings.longEvery === 0 ? "long" : "short") : "work";
    showToast(focusTimer.mode === "work" ? "🎉 Hoàn thành 1 phiên tập trung!" : "☕ Hết giờ nghỉ, quay lại tập trung nào!");
    
    // Auto-suggest next task if moving to work and current task is null or done
    setFocusTimer((prev) => {
      let nextTask = prev.taskId;
      if (nextMode === "work") {
        // Auto pick incomplete task if none selected or if completed
        const curTask = tasks.find(t => t.id === prev.taskId);
        if (!curTask || curTask.status === "done") {
          const highPrio = tasks.find(t => t.status !== "done" && t.priority === "Cao");
          const anyIncomplete = tasks.find(t => t.status !== "done");
          nextTask = highPrio ? highPrio.id : (anyIncomplete ? anyIncomplete.id : null);
        }
      }
      return { mode: nextMode, secondsLeft: focusModeMinutes(nextMode) * 60, running: focusSettings.autoFlow, cycleCount: nextCycle, taskId: nextTask };
    });
  };


  const updateFocusLogEntry = (id, patch) => {
    setFocusLog((log) => log.map((l) => l.id === id ? { ...l, ...patch } : l));
  };

  const startFocus = () => { playSound("click", soundOn); setFocusTimer((f) => ({ ...f, running: true })); };
  const pauseFocus = () => { playSound("click", soundOn); setFocusTimer((f) => ({ ...f, running: false })); };

    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const dStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
      const dueTasks = tasks.filter(t => t.due === dStr);
      if (dueTasks.length === 0) {
        last7.push(0);
      } else {
        const done = dueTasks.filter(t => t.status === "done").length;
        last7.push(done / dueTasks.length >= 0.8 ? 1 : 0);
      }
    }
    
    const allDays = [];
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const dStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];

      }
    }
    
    let currentStreak = 0;
    if (allDays[0].win) {
      for (let i = 0; i < allDays.length; i++) {
        if (allDays[i].win) currentStreak++; else break;
      }
    } else if (allDays[1].win) {
      for (let i = 1; i < allDays.length; i++) {
        if (allDays[i].win) currentStreak++; else break;

                    <label style={labelStyle}>⏰ Giờ làm</label>
                    <input type="time" value={form.workTime || ""} onChange={(e) => setForm({ ...form, workTime: e.target.value })} style={inputStyle} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <label style={labelStyle}>Độ ưu tiên</label>
                    <select value={form.priority || "Vừa"} onChange={(e) => setForm({ ...form, priority: e.target.value })} style={inputStyle}>
                      <option value="Gấp">🔥 Gấp</option>
                      <option value="Vừa">⚡ Vừa</option>
                      <option value="Thấp">☕ Thấp</option>
                    </select>
                  </div>
                </div>

                <label style={labelStyle}>Các bước thực hiện (Subtasks)</label>
                <div style={{ display: "flex", gap: 6, marginBottom: (form.subtasks || []).length > 0 ? 8 : 14 }}>
                  <input
                    value={modalSubDraft}
                    onChange={(e) => setModalSubDraft(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && modalSubDraft.trim()) {
                        e.preventDefault();
                        setForm({ ...form, subtasks: [...(form.subtasks || []), modalSubDraft.trim()] });
                        setModalSubDraft("");
                      }
                    }}
                    placeholder="+ Thêm việc nhỏ (nhấn Enter)..."
                    style={{ ...inputStyle, marginBottom: 0, flex: 1 }}
                  />
                  <button
                    type="button"
                    onClick={() => {
                      if (modalSubDraft.trim()) {
                        setForm({ ...form, subtasks: [...(form.subtasks || []), modalSubDraft.trim()] });
                        setModalSubDraft("");
                      }
                    }}
                    style={{ ...secondaryBtnStyle, padding: "0 14px", flexShrink: 0, fontSize: 12, fontWeight: 700 }}
                  >
                    + Thêm
                  </button>
                </div>
                {(form.subtasks || []).length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: 14, background: "var(--wf-hover-soft)", padding: "8px 10px", borderRadius: 8, maxHeight: 110, overflowY: "auto" }}>
                    {form.subtasks.map((st, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12, fontWeight: 500, color: "var(--wf-text)" }}>
                        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>• {st}</span>
                        <button type="button" onClick={() => setForm({ ...form, subtasks: form.subtasks.filter((_, idx) => idx !== i) })} style={{ background: "none", border: "none", color: "var(--wf-text-muted)", cursor: "pointer", padding: 2, display: "flex" }}>
                          <X size={12} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                {newType === "team" && (
                  <>
                    <label style={labelStyle}>Dự án Nhóm</label>
                    <select value={form.project || ""} onChange={(e) => setForm({ ...form, project: e.target.value, assignees: [] })} style={inputStyle}>
                      {projects.filter(p => p.type === 'team' && (p.members || []).includes(currentUser.name)).map((p) => (<option key={p.id} value={p.name}>{p.name}</option>))}
                    </select>

                    <div style={{ display: "flex", gap: 10 }}>
                      <div style={{ flex: 1 }}>
                        <label style={labelStyle}>Chuyên mục</label>
                        <select value={form.category || ""} onChange={(e) => setForm({ ...form, category: e.target.value })} style={inputStyle}>
                          {(projects.find(p => p.name === form.project)?.categories || ["Chung"]).map((c, i) => (<option key={i} value={c}>{c}</option>))}
                        </select>
                      </div>
                    </div>

                    <label style={labelStyle}>Tham gia (Chọn từ thành viên dự án)</label>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, padding: "8px 12px", background: "var(--wf-input-bg)", border: "1.5px solid var(--wf-border)", borderRadius: 10 }}>
                      {(projects.find(p => p.name === form.project)?.members || []).map(m => {
                        const isSelected = (form.assignees || []).includes(m);
                        const memberColor = members.find(x => x.name === m)?.color || "#8b5cf6";
                        return (
                          <div 
                            key={m} 
                            onClick={() => {
                              const newAssignees = isSelected 
                                ? form.assignees.filter(x => x !== m) 
                                : [...(form.assignees || []), m];
                              setForm({ ...form, assignees: newAssignees });
                            }}
                            style={{ 
                              padding: "4px 10px", borderRadius: 14, fontSize: 11.5, fontWeight: 700, cursor: "pointer", userSelect: "none",
                              background: isSelected ? `${memberColor}20` : "transparent",
                              color: isSelected ? memberColor : "var(--wf-text-muted)",
                              border: `1.5px solid ${isSelected ? memberColor : "var(--wf-border-soft)"}`,
                              transition: "all 0.2s"
                            }}>
                            {m}
                          </div>
                        );
                      })}
                      {(projects.find(p => p.name === form.project)?.members || []).length === 0 && (
                        <div style={{ fontSize: 12, color: "var(--wf-text-muted)" }}>Dự án này chưa có thành viên.</div>
                      )}
                    </div>
                  </>
                )}
                <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
                  <button onClick={() => setModalOpen(false)} style={{ ...secondaryBtnStyle, flex: 1 }}>Hủy</button>
                  <button onClick={submitTask} style={{ ...primaryBtnStyle, flex: 1.4 }}>Thêm công việc</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {toast && (
        <div className="wf-toast" style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "#1a2035", color: "#fff", padding: "10px 18px", borderRadius: 10, fontSize: 13, fontWeight: 500, zIndex: 60, boxShadow: "0 8px 20px rgba(0,0,0,0.2)" }}>
          {toast}
        </div>
      )}

      {zenMode && (
        <ZenOverlay
          focusTimer={focusTimer} focusSettings={focusSettings} tasks={tasks}
          onStart={startFocus} onPause={pauseFocus} onReset={resetFocus} onSwitchMode={switchFocusMode}
          onExit={toggleZenMode} soundOn={soundOn} setSoundOn={setSoundOn}
        />
      )}

      {reflectId && focusLog.find((l) => l.id === reflectId) && (
        <ReflectionModal
          entry={focusLog.find((l) => l.id === reflectId)}
          onClose={() => setReflectId(null)}
          onSave={(patch) => { updateFocusLogEntry(reflectId, patch); setReflectId(null); playSound("click", soundOn); showToast("Đã lưu nhật ký phiên tập trung"); }}
        />
      )}

      {surprise && <SurpriseModal surprise={surprise} onClose={() => setSurprise(null)} />}
    </div>
  );
}

// ================= Views =================

function DashboardView({ showTeam, currentUser, tasks, projects, statCards, openAddModal, onOpenDetail, celebrate, onToggleTask, habits, onToggleHabitDay, onGoHabits, quickAdd, setQuickAdd, submitQuickAdd, onGoProject, onGoTeamProject, onQuickAdd, onRescheduleTask, onUpdateWorkTime, onReorderTasks, todaySortMode, setTodaySortMode, onPomodoro, events, setEvents, stickyNote, setStickyNote }) {
  const [localQuickAdd, setLocalQuickAdd] = useState("");
  const [weekQuickAdd, setWeekQuickAdd] = useState({});
  const [draggingTask, setDraggingTask] = useState(null);
  const [overDate, setOverDate] = useState(null);
  const [expandedWeek, setExpandedWeek] = useState(false);
  const [weekOffset, setWeekOffset] = useState(0);

  const handleDrop = (dateStr) => {
    if (draggingTask && onRescheduleTask) onRescheduleTask(draggingTask.id, dateStr);
    setDraggingTask(null); setOverDate(null);
  };
  const todayIdx = (new Date(todayStr).getDay() + 6) % 7;
  const habitsDone = habits.filter((h) => h.checked[todayIdx]).length;
  const inboxTasks = tasks.filter(t => !t.due && t.status !== "done");
  const todayTasks = tasks.filter(t => t.due === todayStr);
  const allTodayTasks = tasks.filter(t => t.due === todayStr);
  const todayDoneCount = allTodayTasks.filter(t => t.status === "done").length;
  const todayTotalCount = allTodayTasks.length;
  const todayPct = todayTotalCount > 0 ? Math.round((todayDoneCount / todayTotalCount) * 100) : 0;
  const overdueTasks = tasks.filter(t => t.due && t.due < todayStr && t.status !== "done");

  const statCardsWithHabit = statCards.map((c, i) => i === 3 ? { ...c, value: `${habitsDone}/${habits.length}`, sub: `${habits.length} thói quen đang theo dõi` } : c);

  const dObj = new Date(todayStr);
  dObj.setDate(dObj.getDate() + (weekOffset * 7));
  const nextDates = [];
  const daysOfWeek = ["CN", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
  for (let i = 0; i <= 6; i++) {
    const nd = new Date(dObj);
    nd.setDate(nd.getDate() + i);
    nextDates.push({
      dateStr: nd.toISOString().split('T')[0],
      dayName: weekOffset === 0 && i === 0 ? "Hôm nay" : daysOfWeek[nd.getDay()]
    });
  }

  const statGrads = ["linear-gradient(135deg,#6d28d9,#8b5cf6)","linear-gradient(135deg,#dc2626,#f97316)","linear-gradient(135deg,#0e7490,#06b6d4)","linear-gradient(135deg,#059669,#10b981)"];
  const statEmojis = ["✅","⏰","🚨","🏃"];

  return (
    <>
      {/* ── Stat Cards ── */}
      <div className="wf-dash-stat-grid">
        {statCardsWithHabit.map((c, ci) => {
          const Icon = c.icon;
          return (
            <div key={c.label} className="wf-card-pop" style={{ position: "relative", borderRadius: 22, padding: "20px 20px 16px", overflow: "hidden", background: statGrads[ci], color: "#fff", boxShadow: ["0 8px 28px rgba(109,40,217,0.38)","0 8px 28px rgba(220,38,38,0.35)","0 8px 28px rgba(14,116,163,0.35)","0 8px 28px rgba(5,150,105,0.35)"][ci] }}>
              {celebrate && ci === 0 && <Confetti />}
              <div style={{ position: "absolute", inset: 0, background: "linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,0.18) 50%,rgba(255,255,255,0) 60%)", backgroundSize: "200% 100%", animation: "wfShimmer 3s infinite" }} />
              <div style={{ position: "absolute", top: -20, right: -20, width: 90, height: 90, background: "rgba(255,255,255,0.1)", borderRadius: "50%" }} />
              <div style={{ position: "relative", zIndex: 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 14, background: "rgba(255,255,255,0.22)", display: "flex", alignItems: "center", justifyContent: "center" }}><Icon size={20} color="#fff" /></div>
                  <span style={{ fontSize: 22 }}>{statEmojis[ci]}</span>
                </div>
                <div style={{ fontSize: 32, fontWeight: 900, lineHeight: 1.1, letterSpacing: "-1px" }}>{c.value}</div>
                <div style={{ fontSize: 13, fontWeight: 700, opacity: 0.95, marginTop: 2 }}>{c.label}</div>
                <div style={{ fontSize: 11, opacity: 0.75, marginTop: 3 }}>{c.sub}</div>
              </div>
            </div>
          );
        })}
      </div>

      {celebrate && (
        <div style={{ textAlign: "center", fontSize: 13.5, fontWeight: 800, background: "linear-gradient(90deg,#6d28d9,#ec4899)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", marginBottom: 16 }}>
          🎉 Tuyệt vời! Bạn đã hoàn thành 100% công việc hôm nay!
        </div>
      )}

      {/* ── Row 1: Today / Overdue+Inbox / Habits ── */}
      <div className="wf-dash-row1-grid">
        {/* Today */}
        <div style={{ background: "var(--wf-surface)", borderRadius: 20, padding: 18, border: "1px solid rgba(220,38,38,0.12)", position: "relative", overflow: "hidden", boxShadow: "0 4px 20px rgba(220,38,38,0.07)" }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 4, background: "linear-gradient(90deg,#dc2626,#f97316)" }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <h3 style={{ margin: 0, fontSize: 14, fontWeight: 800, color: "#dc2626" }}>🎯 HÔM NAY</h3>
              <div style={{ display: "flex", gap: 4, background: "rgba(220,38,38,0.06)", padding: "2px", borderRadius: 8, border: "1px solid rgba(220,38,38,0.15)" }}>
                <button onClick={() => setTodaySortMode("time")} title="Theo giờ làm" style={{ background: todaySortMode === "time" ? "#dc2626" : "transparent", color: todaySortMode === "time" ? "#fff" : "var(--wf-text-muted)", border: "none", borderRadius: 6, padding: 4, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", width: 24, height: 24, transition: "all 0.2s" }}><Clock size={14} /></button>
                <button onClick={() => setTodaySortMode("order")} title="Số thứ tự / Kéo thả" style={{ background: todaySortMode === "order" ? "#dc2626" : "transparent", color: todaySortMode === "order" ? "#fff" : "var(--wf-text-muted)", border: "none", borderRadius: 6, padding: 4, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", width: 24, height: 24, transition: "all 0.2s" }}><GripVertical size={14} /></button>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 11, fontWeight: 700, background: "#fee2e2", color: "#dc2626", padding: "3px 9px", borderRadius: 20 }}>{todayDoneCount}/{todayTotalCount} việc ({todayPct}%)</span>
              <div title={`Hoàn thành ${todayPct}%`} style={{ width: 34, height: 34, borderRadius: "50%", background: `conic-gradient(#dc2626 ${todayPct * 3.6}deg, var(--wf-border-soft) 0deg)`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div style={{ width: 24, height: 24, borderRadius: "50%", background: "var(--wf-surface)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9.5, fontWeight: 800, color: "#dc2626" }}>{todayPct}%</div>
              </div>
            </div>
          </div>
          {todayTotalCount > 0 && (
            <div style={{ background: "#fee2e2", borderRadius: 8, height: 5, width: "100%", overflow: "hidden", marginBottom: 10 }}>
              <div style={{ width: `${todayPct}%`, background: "linear-gradient(90deg,#dc2626,#f97316)", height: "100%", transition: "width 0.4s ease" }} />
            </div>
          )}
          <TodayTaskScheduler tasks={todayTasks} projects={projects} onToggle={onToggleTask} onOpenDetail={onOpenDetail} onPomodoro={onPomodoro} onUpdateWorkTime={onUpdateWorkTime} onReorder={onReorderTasks} sortMode={todaySortMode} setSortMode={setTodaySortMode} compact={true} />
          <input value={localQuickAdd} onChange={e => setLocalQuickAdd(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && localQuickAdd.trim()) { onQuickAdd && onQuickAdd(localQuickAdd, todayStr); setLocalQuickAdd(""); } }}
            placeholder="+ Thêm việc hôm nay..." className="wf-input"
            style={{ width: "100%", border: "none", borderTop: "1px dashed var(--wf-border)", background: "transparent", padding: "9px 4px 0", fontSize: 12.5, outline: "none", color: "var(--wf-text)", marginTop: 10 }} />
        </div>

        {/* Overdue + Inbox */}
        <div style={{ background: "var(--wf-surface)", borderRadius: 20, padding: 18, border: "1px solid rgba(124,58,237,0.1)", position: "relative", overflow: "hidden", boxShadow: "0 4px 20px rgba(124,58,237,0.06)" }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 4, background: "linear-gradient(90deg,#7c3aed,#ec4899)" }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h3 style={{ margin: 0, fontSize: 14, fontWeight: 800, color: "#7c3aed" }}>⚠️ TRỄ HẠN</h3>
            <span style={{ fontSize: 11, fontWeight: 700, background: "#f3e8ff", color: "#7c3aed", padding: "3px 9px", borderRadius: 20 }}>{overdueTasks.length} việc</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 7, maxHeight: 130, overflowY: "auto" }} className="wf-scrollbar">
            {overdueTasks.length === 0 && <div style={{ fontSize: 12.5, color: "var(--wf-text-muted)", textAlign: "center", padding: "14px 0" }}>✨ Không có việc trễ hạn!</div>}
            {overdueTasks.map(t => (
              <div key={t.id} onClick={() => onOpenDetail(t)} style={{ display: "flex", alignItems: "center", gap: 8, background: "rgba(124,58,237,0.06)", padding: "9px 11px", borderRadius: 11, cursor: "pointer", borderLeft: "3px solid #7c3aed", transition: "transform 0.15s ease" }}
                onMouseEnter={e => e.currentTarget.style.transform="translateX(3px)"} onMouseLeave={e => e.currentTarget.style.transform="translateX(0)"}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: "var(--wf-text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.title}</div>
                  <div style={{ fontSize: 10.5, color: "#ef4444", marginTop: 1, fontWeight: 600 }}>Hạn: {t.due}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid var(--wf-border-soft)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontSize: 12, fontWeight: 800, color: "#6366f1" }}>📥 INBOX</span>
              <button onClick={() => openAddModal()} style={{ background: "none", border: "none", color: "#6366f1", fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}>+ Thêm</button>
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {inboxTasks.length === 0 ? <span style={{ fontSize: 11.5, color: "var(--wf-text-muted)" }}>Inbox sạch! 🎉</span> :
               inboxTasks.slice(0, 3).map(t => (
                <div key={t.id} onClick={() => onOpenDetail(t)} style={{ background: "var(--wf-hover-soft)", padding: "4px 10px", borderRadius: 8, fontSize: 11.5, cursor: "pointer", whiteSpace: "nowrap", fontWeight: 600, color: "var(--wf-text-secondary)" }}>
                  {t.title.length > 20 ? t.title.slice(0,20)+"…" : t.title}
                </div>
              ))}
              {inboxTasks.length > 3 && <span style={{ fontSize: 11.5, color: "var(--wf-text-muted)", padding: "4px 0" }}>+{inboxTasks.length - 3} nữa</span>}
            </div>
          </div>
        </div>

        {/* Habits */}

          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 4, background: "linear-gradient(90deg,#f97316,#eab308)" }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h3 style={{ margin: 0, fontSize: 14, fontWeight: 800, color: "#f97316" }}>🔥 THÓI QUEN</h3>
            <div style={{ width: 44, height: 44, borderRadius: "50%", background: `conic-gradient(#f97316 ${habits.length > 0 ? (habitsDone/habits.length)*360 : 0}deg, var(--wf-border-soft) 0deg)`, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <div style={{ width: 32, height: 32, borderRadius: "50%", background: "var(--wf-surface)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800, color: "#f97316" }}>{habits.length > 0 ? Math.round((habitsDone/habits.length)*100) : 0}%</div>
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 190, overflowY: "auto" }} className="wf-scrollbar">
            {habits.length === 0 && <div style={{ fontSize: 12.5, color: "var(--wf-text-muted)" }}>Chưa có thói quen nào.</div>}
            {habits.map((h, hi) => {
              const done = h.checked[todayIdx];
              const hColor = memberColors[hi % memberColors.length];
              const pastDays = h.checked.slice(0, todayIdx + 1);
              const streakIdx = [...pastDays].reverse().findIndex(c => !c);
              const curStreak = streakIdx === -1 ? pastDays.length : streakIdx;
              return (
                <div key={h.name} onClick={() => onToggleHabitDay(h.name, todayIdx)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 9px", borderRadius: 10, cursor: "pointer", background: done ? `${hColor}18` : "var(--wf-hover-soft)", transition: "all 0.18s ease" }}>
                  <div style={{ width: 18, height: 18, borderRadius: 5, background: done ? hColor : "transparent", border: `1.5px solid ${hColor}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    {done && <Check size={11} color="#fff" />}
                  </div>
                  <span style={{ flex: 1, fontSize: 12.5, fontWeight: 600, color: done ? "var(--wf-text-muted)" : "var(--wf-text)", textDecoration: done ? "line-through" : "none" }}>{h.name}</span>
                  <span style={{ fontSize: 10.5, fontWeight: 700, color: curStreak > 0 ? hColor : "var(--wf-text-muted)" }}>🔥 {curStreak}</span>
                </div>
              );
            })}
          </div>
          <button onClick={onGoHabits} style={{ marginTop: 10, width: "100%", background: "rgba(249,115,22,0.08)", border: "1px solid rgba(249,115,22,0.2)", color: "#f97316", borderRadius: 10, padding: "7px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Habit Tracker →</button>
        </div>
      </div>

      {/* ── Row 2: Week Kanban + Projects ── */}
      <div className="wf-dash-row2-grid">
        {/* Week */}
        <div style={{ background: "var(--wf-surface)", borderRadius: 20, padding: 18, border: "1px solid rgba(245,158,11,0.12)", position: "relative", overflow: "hidden", boxShadow: "0 4px 20px rgba(245,158,11,0.07)", display: "flex", flexDirection: "column" }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 4, background: "linear-gradient(90deg,#f59e0b,#10b981)" }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <h3 style={{ margin: 0, fontSize: 14, fontWeight: 800, color: "#f59e0b" }}>📅 {weekOffset === 0 ? "TUẦN NÀY" : weekOffset < 0 ? `CÁCH ĐÂY ${-weekOffset} TUẦN` : `TUẦN ${weekOffset} TỚI`}</h3>
              <div style={{ display: "flex", alignItems: "center", background: "rgba(245,158,11,0.1)", borderRadius: 8, padding: 2 }}>
                <button onClick={() => setWeekOffset(w => w - 1)} style={{ background: "none", border: "none", cursor: "pointer", color: "#f59e0b", padding: "4px 8px" }}>&lt;</button>
                <button onClick={() => setWeekOffset(0)} style={{ background: "none", border: "none", cursor: "pointer", color: "#f59e0b", padding: "4px 8px", fontSize: 11, fontWeight: 700 }}>Hôm nay</button>
                <button onClick={() => setWeekOffset(w => w + 1)} style={{ background: "none", border: "none", cursor: "pointer", color: "#f59e0b", padding: "4px 8px" }}>&gt;</button>

function TodayTaskScheduler({ tasks, projects, onToggle, onCycle, onRemove, onOpenDetail, onPomodoro, onUpdateWorkTime, onReorder, sortMode = "time", setSortMode, compact = false }) {
  const [draggedId, setDraggedId] = useState(null);
  const [overId, setOverId] = useState(null);

  const sorted = [...tasks].sort((a, b) => {
    if (a.status === "done" && b.status !== "done") return 1;
    if (a.status !== "done" && b.status === "done") return -1;

    if (sortMode === "time") {
      const tA = a.workTime || "23:59";
      const tB = b.workTime || "23:59";
      const cmp = tA.localeCompare(tB);
      if (cmp !== 0) return cmp;
    }
    return 0;
  });

  const handleDrop = (e, targetId) => {
    e.preventDefault();
    if (!draggedId || draggedId === targetId) return;
    if (sortMode === "time" && setSortMode) {
      setSortMode("order");
      onReorder && onReorder(draggedId, targetId, "order");
    } else {
      onReorder && onReorder(draggedId, targetId, sortMode);
    }
    setDraggedId(null);
    setOverId(null);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {sorted.length === 0 && <div style={{ fontSize: 12.5, color: "var(--wf-text-muted)", textAlign: "center", padding: "18px 0" }}>☀️ Hôm nay thảnh thơi! Chưa có việc nào.</div>}

      <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: compact ? 260 : "none", overflowY: compact ? "auto" : "visible" }} className="wf-scrollbar">
        {sorted.map((t, idx) => {
          const isOver = overId === t.id;
          return (
            <div key={t.id}
              draggable
              onDragStart={(e) => { setDraggedId(t.id); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(t.id)); } catch {} }}
              onDragOver={(e) => { e.preventDefault(); setOverId(t.id); }}
              onDragLeave={() => setOverId(id => id === t.id ? null : id)}
              onDrop={(e) => handleDrop(e, t.id)}
              onDragEnd={() => { setDraggedId(null); setOverId(null); }}
              onClick={() => onOpenDetail && onOpenDetail(t)}
