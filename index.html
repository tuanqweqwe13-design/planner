function CoursePlannerView({ project, onUpdateProject, onSyncLessonTask }) {
  const planName = project.name;
  const modules = project.plans || [];

  const [newModuleDraft, setNewModuleDraft] = useState("");
  const [newModuleDuration, setNewModuleDuration] = useState("1 ngày");
  const [lessonDrafts, setLessonDrafts] = useState({});
  const [isFullscreen, setIsFullscreen] = useState(false);

  const modColors  = ["#6366f1","#10b981","#f97316","#ec4899","#a855f7","#eab308","#06b6d4","#ef4444"];
  const modBgLight = ["rgba(99,102,241,0.07)","rgba(16,185,129,0.07)","rgba(249,115,22,0.07)","rgba(236,72,153,0.07)","rgba(168,85,247,0.07)","rgba(234,179,8,0.07)","rgba(6,182,212,0.07)","rgba(239,68,68,0.07)"];

  const updateNodeRec = (nodes, id, updates) => {
    return nodes.map(n => {
      if (n.id === id) return { ...n, ...updates };
      if (n.items) return { ...n, items: updateNodeRec(n.items, id, updates) };
      return n;
    });
  };

  const removeNodeRec = (nodes, id) => {
    return nodes.filter(n => n.id !== id).map(n => {
      if (n.items) return { ...n, items: removeNodeRec(n.items, id) };
      return n;
    });
  };

  const addChildRec = (nodes, parentId, newChild) => {
    return nodes.map(n => {
      if (n.id === parentId) return { ...n, items: [...(n.items || []), newChild] };
      if (n.items) return { ...n, items: addChildRec(n.items, parentId, newChild) };
      return n;
    });
  };

  const findNodeRec = (nodes, id) => {
    for (const n of nodes) {
      if (n.id === id) return n;
      if (n.items) {
        const found = findNodeRec(n.items, id);
        if (found) return found;
      }
    }
    return null;
  };

  const countLessons = (nodes) => { let t = 0; let d = 0; for (const n of nodes) { if (n.items && n.items.length > 0) { const [subT, subD] = countLessons(n.items); t += subT; d += subD; } else if (n.text) { t += 1; if (n.done) d += 1; } } return [t, d]; };
  const [totalLessons, doneLessons] = countLessons(modules);

  const updateModules = (newMods) => onUpdateProject({ plans: newMods });

  const applyFormat = (inputId, value, setValue, prefix, suffix = prefix) => {
    const el = document.getElementById(inputId);
    if (!el) {
      setValue(value + prefix + suffix);
      return;
    }
    const start = el.selectionStart || 0;
    const end = el.selectionEnd || 0;
    const selected = value.substring(start, end);
    const before = value.substring(0, start);
    const after = value.substring(end);
    const newVal = before + prefix + selected + suffix + after;
    setValue(newVal);
    setTimeout(() => {
      el.focus();
      if (start === end) {
        el.setSelectionRange(start + prefix.length, start + prefix.length);
      } else {
        el.setSelectionRange(start + prefix.length, end + prefix.length);
      }
    }, 10);
  };

  const FormatButtons = ({ inputId, value, setValue }) => (
    <div style={{ display: "flex", alignItems: "center", gap: 3, flexShrink: 0, marginRight: 4 }}>
      <button type="button" onClick={() => applyFormat(inputId, value, setValue, "**", "**")}
        style={{ width: 22, height: 22, borderRadius: 5, border: "1px solid var(--wf-border-soft)", background: "var(--wf-surface)", cursor: "pointer", fontSize: 11, fontWeight: 800, color: "var(--wf-text)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 1px 2px rgba(0,0,0,0.05)" }} title="In đậm (Bold)">B</button>
      <button type="button" onClick={() => applyFormat(inputId, value, setValue, "__", "__")}
        style={{ width: 22, height: 22, borderRadius: 5, border: "1px solid var(--wf-border-soft)", background: "var(--wf-surface)", cursor: "pointer", fontSize: 11, textDecoration: "underline", fontWeight: 700, color: "var(--wf-text)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 1px 2px rgba(0,0,0,0.05)" }} title="Gạch chân (Underline)">U</button>
      <button type="button" onClick={() => applyFormat(inputId, value, setValue, "*", "*")}
        style={{ width: 22, height: 22, borderRadius: 5, border: "1px solid var(--wf-border-soft)", background: "var(--wf-surface)", cursor: "pointer", fontSize: 11, fontStyle: "italic", fontWeight: 700, color: "var(--wf-text)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 1px 2px rgba(0,0,0,0.05)" }} title="In nghiêng (Italic)">I</button>
    </div>
  );

  const parseMD = (text) => {
    if (!text) return "";
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/__(.*?)__/g, '<u>$1</u>')
      .replace(/<u>(.*?)<\/u>/g, '<u>$1</u>')
      .replace(/~~(.*?)~~/g, '<del>$1</del>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code style="background:var(--wf-hover-soft);padding:2px 4px;border-radius:4px;color:#6366f1;font-size:11.5px">$1</code>')
      .replace(/^-\s+(.*)/, '• $1')
      .replace(/^>\s+(.*)/, '<span style="border-left:2px solid #6366f1;padding-left:6px;color:var(--wf-text-secondary);font-style:italic">$1</span>');
  };


  const onAddModule = () => {
    if (!newModuleDraft.trim()) return;
    updateModules([...modules, { id: "m"+Date.now(), name: newModuleDraft.trim(), duration: newModuleDuration||"1 ngày", items: [] }]);
    setNewModuleDraft("");
  };


  const onAddLesson = (parentId, text) => {
    updateModules(addChildRec(modules, parentId, { id: "i"+Date.now(), text, date: "", done: false }));
  };

  const onAddChildModule = (parentId, name) => {
    updateModules(addChildRec(modules, parentId, { id: "m"+Date.now(), name, duration: "1 ngày", items: [] }));
  };

  const onEditNode = (id, updates) => {
    updateModules(updateNodeRec(modules, id, updates));
  };

  const onToggleLesson = (id) => {
    const item = findNodeRec(modules, id);
    if (!item) return;
    updateModules(updateNodeRec(modules, id, { done: !item.done }));
    if (item.date && onSyncLessonTask) onSyncLessonTask(id, item.text, planName, item.date, !item.done);
  };

  const onRemoveLesson = (id) => {
    updateModules(removeNodeRec(modules, id));
    if (onSyncLessonTask) onSyncLessonTask(id, "", planName, null, false);
  };

  const onSetLessonDate = (id, date) => {
    updateModules(updateNodeRec(modules, id, { date }));
    const item = findNodeRec(modules, id);
    if (item && onSyncLessonTask) onSyncLessonTask(id, item.text, planName, date, item.done);
  };


  const RecursiveLessonNode = ({ node, level, color, bgLight, onToggle, onRemove, onSetDate, onAddChild, onAddChildModule, onEditNode }) => {
    const items = node.items || [];
    const [draft, setDraft] = useState("");
    const [expanded, setExpanded] = useState(true);

    if (node.name) {
      // Is Sub-Module
      return (
        <div style={{ display: "flex", flexDirection: "column" }}>
          <div className="wf-row" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: `8px 14px 8px ${14 + level * 20}px`, background: bgLight, borderBottom: "1px solid var(--wf-border-soft)", position: "relative" }}>
            {level > 0 && <div style={{ position: "absolute", left: 14 + (level-1)*20 + 8, top: 0, bottom: 0, width: 1, background: "var(--wf-border-soft)" }} />}
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span dangerouslySetInnerHTML={{ __html: parseMD(node.name) }} style={{ fontSize: 12.5, fontWeight: 700, color: color }}></span>
              <button onClick={() => { const newName = prompt("Tên module:", node.name); if(newName) onEditNode(node.id, {name: newName}); }} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", padding: 2 }} title="Sửa tên"><Edit2 size={12}/></button>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <button onClick={() => setExpanded(!expanded)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", padding: 4 }}>
                {expanded ? <ChevronUp size={13}/> : <ChevronDown size={13}/>}
              </button>
              <button onClick={() => onRemove(node.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", padding: 4 }}><Trash2 size={13} /></button>
            </div>
          </div>
          {expanded && (
            <div style={{ display: "flex", flexDirection: "column" }}>
              {items.map((child) => (
                <RecursiveLessonNode key={child.id} node={child} level={level + 1} color={color} bgLight={bgLight} onToggle={onToggle} onRemove={onRemove} onSetDate={onSetDate} onAddChild={onAddChild} onAddChildModule={onAddChildModule} onEditNode={onEditNode} />
              ))}
              <div style={{ display: "flex", alignItems: "center", gap: 8, padding: `6px 14px 6px ${14 + (level+1)*20}px`, background: "var(--wf-hover-soft)", minHeight: 38, position: "relative", borderBottom: "1px solid var(--wf-border-soft)" }}>
                <div style={{ position: "absolute", left: 14 + level*20 + 8, top: 0, bottom: 0, width: 1, background: "var(--wf-border-soft)" }} />
                <input value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && draft.trim()) { onAddChild(node.id, draft.trim()); setDraft(""); } }} placeholder={"+ Thêm bài học..."} style={{ flex: 1, border: "none", background: "transparent", fontSize: 12.5, outline: "none", color: "var(--wf-text-muted)", fontFamily: "inherit" }} />
                <button onClick={() => { const name = prompt("Tên module con:"); if(name) onAddChildModule(node.id, name); }} style={{ background: "none", border: "none", cursor: "pointer", color: color, fontSize: 11, fontWeight: 700 }}>+ Module con</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Is Lesson
    return (
      <div style={{ display: "flex", flexDirection: "column" }}>
        <div className="wf-row" style={{ display: "flex", alignItems: "center", gap: 0, padding: `0 14px 0 ${14 + level * 20}px`, minHeight: 42, background: "var(--wf-surface)", position: "relative", borderBottom: "1px solid var(--wf-border-soft)" }}>
          {level > 0 && <div style={{ position: "absolute", left: 14 + (level-1)*20 + 8, top: 0, bottom: 0, width: 1, background: "var(--wf-border-soft)" }} />}
          
          <div onClick={() => onToggle(node.id)}
            style={{ width: 17, height: 17, borderRadius: 4, border: `1.5px solid ${node.done ? color : "var(--wf-border)"}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", background: node.done ? color : "transparent", flexShrink: 0, marginRight: 10, transition: "all 0.15s ease" }}>
            {node.done && <Check size={10} color="#fff" />}
          </div>
          <span dangerouslySetInnerHTML={{ __html: parseMD(node.text) }} style={{ flex: 1, fontSize: 13, fontWeight: 500, color: node.done ? "var(--wf-text-muted)" : "var(--wf-text)", textDecoration: node.done ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", transition: "color 0.15s" }}>
          </span>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginLeft: 8, flexShrink: 0 }}>
            <input type="date" value={node.date || ""} onChange={e => onSetDate(node.id, e.target.value)}
              style={{ border: "none", background: "transparent", fontSize: 11.5, color: node.date ? "var(--wf-text-secondary)" : "var(--wf-text-faint)", outline: "none", width: 118, cursor: "pointer", fontFamily: "inherit" }} />
            {items.length > 0 && (
              <button onClick={() => setExpanded(!expanded)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", padding: 4, opacity: 0.6 }}>
                {expanded ? <ChevronUp size={13}/> : <ChevronDown size={13}/>}
              </button>
            )}
            <button onClick={() => onRemove(node.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", padding: 4, opacity: 0.6 }}>
              <Trash2 size={13} />
            </button>
          </div>
        </div>

        {expanded && items.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column" }}>
            {items.map((child) => (
              <RecursiveLessonNode key={child.id} node={child} level={level + 1} color={color} bgLight={bgLight} onToggle={onToggle} onRemove={onRemove} onSetDate={onSetDate} onAddChild={onAddChild} onAddChildModule={onAddChildModule} onEditNode={onEditNode} />
            ))}
          </div>
        )}
        
        {expanded && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: `6px 14px 6px ${14 + (level+1)*20}px`, background: "var(--wf-hover-soft)", minHeight: 38, position: "relative", borderBottom: "1px solid var(--wf-border-soft)" }}>
            <div style={{ position: "absolute", left: 14 + level*20 + 8, top: 0, bottom: 0, width: 1, background: "var(--wf-border-soft)" }} />
            <input
              value={draft}
              onChange={e => setDraft(e.target.value)}
              onKeyDown={e => {
                if (e.key === "Enter" && draft.trim()) {
                  onAddChild(node.id, draft.trim());
                  setDraft("");
                }
              }}
              placeholder={"+ Thêm việc con cho bài học..."}
              style={{ flex: 1, border: "none", background: "transparent", fontSize: 12.5, outline: "none", color: "var(--wf-text-muted)", fontFamily: "inherit" }} />
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={isFullscreen ? {
      position: "fixed", top: 0, left: 0, right: 0, bottom: 0, zIndex: 9999, margin: 0, borderRadius: 0,
      display: "flex", flexDirection: "column", background: "var(--wf-surface)", overflow: "hidden", border: "none"
    } : {
      display: "flex", flexDirection: "column", background: "var(--wf-surface)", borderRadius: 18, overflow: "hidden", boxShadow: "0 8px 32px rgba(26,32,53,0.08)", border: "1px solid var(--wf-border-soft)", minHeight: 400
    }}>
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 18px", borderBottom: "1px solid var(--wf-border-soft)", background: "var(--wf-page-bg)" }}>
        <div style={{ fontWeight: 800, fontSize: 14, color: "var(--wf-text)", flex: 1 }}>{planName}</div>
        <span style={{ fontSize: 11.5, fontWeight: 700, background: "rgba(99,102,241,0.1)", color: "#6366f1", padding: "3px 10px", borderRadius: 10 }}>{modules.length} module</span>
        <span style={{ fontSize: 11.5, fontWeight: 700, background: "rgba(16,185,129,0.1)", color: "#10b981", padding: "3px 10px", borderRadius: 10 }}>{totalLessons} bài học</span>
        {totalLessons > 0 && <span style={{ fontSize: 11.5, fontWeight: 700, background: "rgba(239,68,68,0.1)", color: "#ef4444", padding: "3px 10px", borderRadius: 10 }}>{totalLessons - doneLessons} deadline</span>}
        <button onClick={() => setIsFullscreen(!isFullscreen)} style={{ background: "none", border: "none", color: "var(--wf-text-muted)", cursor: "pointer", display: "flex", alignItems: "center", padding: 4 }} title={isFullscreen ? "Thu nhỏ" : "Phóng to"}>
          {isFullscreen ? <Minimize2 size={16} /> : <Maximize2 size={16} />}
        </button>
      </div>

      {/* Table Body */}
      <div style={{ flex: 1, overflowY: "auto" }} className="wf-scrollbar">
        {modules.length === 0 && (
          <div style={{ textAlign: "center", padding: "48px 0", color: "var(--wf-text-muted)", fontSize: 13 }}>Chưa có module nào. Thêm module đầu tiên bên dưới!</div>
        )}
        {modules.map((m, mi) => {
          const color = modColors[mi % modColors.length];
          const bgLight = modBgLight[mi % modBgLight.length];
          const items = m.items || [];
          const modDone = items.filter(i => i.done).length;
          return (
            <div key={m.id} style={{ display: "flex", borderBottom: "1px solid var(--wf-border-soft)" }}>
              {/* Left: Module label */}
              <div style={{ width: 164, flexShrink: 0, padding: "14px 14px", background: bgLight, borderRight: "1px solid var(--wf-border-soft)", display: "flex", flexDirection: "column", gap: 6 }}>
                <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 4 }}>
                  <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                    <span dangerouslySetInnerHTML={{ __html: parseMD(m.name) }} style={{ fontSize: 12.5, fontWeight: 800, color, lineHeight: 1.35, wordBreak: "break-word" }}></span>
                    <button onClick={() => { const newName = prompt("Tên module:", m.name); if(newName) onEditNode(m.id, {name: newName}); }} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", padding: 2, opacity: 0.55 }} title="Sửa tên">
                      <Edit2 size={12} />
                    </button>
                  </div>
                  <button onClick={() => onRemoveLesson(m.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", padding: 2, opacity: 0.55, flexShrink: 0 }} title="Xóa module">
                    <Trash2 size={12} />
                  </button>
                </div>
                <div style={{ fontSize: 10.5, color: "var(--wf-text-muted)", fontWeight: 600 }}>{m.duration}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 2 }}>
                  <BookOpen size={10} color={color} />
                  <div style={{ width: 14, height: 14, borderRadius: "50%", border: `2.5px solid ${color}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <div style={{ width: 6, height: 6, borderRadius: "50%", background: modDone===items.length && items.length>0 ? color : "transparent" }} />
                  </div>
                  {items.length > 0 && <span style={{ fontSize: 10, color: "var(--wf-text-muted)" }}>{modDone}/{items.length}</span>}
                </div>
              </div>

              {/* Right: Lessons */}
              <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
                {items.map((item) => (
                  <RecursiveLessonNode key={item.id} node={item} level={0} color={color} bgLight={bgLight} onToggle={onToggleLesson} onRemove={onRemoveLesson} onSetDate={onSetLessonDate} onAddChild={onAddLesson} onAddChildModule={onAddChildModule} onEditNode={onEditNode} />
                ))}

                {/* Add lesson row */}
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 14px", background: "var(--wf-hover-soft)", borderTop: items.length>0 ? "1px solid var(--wf-border-soft)" : "none", minHeight: 38 }}>
                  <input
                    id={`input-lesson-${m.id}`}
                    value={lessonDrafts[m.id] || ""}
                    onChange={e => setLessonDrafts({...lessonDrafts,[m.id]:e.target.value})}
                    onKeyDown={e => {
                      if (e.key === "Enter" && lessonDrafts[m.id]?.trim()) {
                        onAddLesson(m.id, lessonDrafts[m.id].trim());
                        setLessonDrafts({...lessonDrafts,[m.id]:""});
                      }
                    }}
                    placeholder={"+ Bài học cho " + m.name + "..."}
                    style={{ flex: 1, border: "none", background: "transparent", fontSize: 12.5, outline: "none", color: "var(--wf-text-muted)", fontFamily: "inherit" }} />
                  <FormatButtons inputId={`input-lesson-${m.id}`} value={lessonDrafts[m.id] || ""} setValue={(val) => setLessonDrafts({...lessonDrafts, [m.id]: val})} />
                  <button onClick={() => { if (lessonDrafts[m.id]) { onAddLesson(m.id, lessonDrafts[m.id]); setLessonDrafts({...lessonDrafts,[m.id]:""}); } }}
                    style={{ width: 26, height: 26, borderRadius: 8, background: color, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, boxShadow: "0 2px 8px rgba(0,0,0,0.2)" }}>
                    <Plus size={14} color="#fff" />
                  </button>
                  <button onClick={() => { const name = prompt("Tên module con:"); if(name) onAddChildModule(m.id, name); }} style={{ background: "none", border: "none", cursor: "pointer", color: color, fontSize: 11, fontWeight: 700, flexShrink: 0 }}>+ Module con</button>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Footer */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 16px", borderTop: "1px solid var(--wf-border-soft)", background: "var(--wf-page-bg)" }}>
        <input
          id="input-new-module"
          value={newModuleDraft}
          onChange={e => setNewModuleDraft(e.target.value)}
          onKeyDown={e => e.key==="Enter" && onAddModule()}
          placeholder={"+ Thêm module mới..."}
          style={{ flex: 1, border: "none", background: "transparent", fontSize: 12.5, outline: "none", color: "var(--wf-text)", fontFamily: "inherit" }} />
        <FormatButtons inputId="input-new-module" value={newModuleDraft} setValue={setNewModuleDraft} />
        <input
          value={newModuleDuration}
          onChange={e => setNewModuleDuration(e.target.value)}
          placeholder="1 ngày"
          style={{ width: 64, border: "1px solid var(--wf-border-soft)", borderRadius: 8, padding: "5px 8px", fontSize: 12, outline: "none", textAlign: "center", color: "var(--wf-text-secondary)", fontFamily: "inherit", background: "var(--wf-surface)" }} />
        <button onClick={onAddModule}
          style={{ background: "linear-gradient(135deg,#6d28d9,#8b5cf6)", color: "#fff", border: "none", borderRadius: 10, padding: "7px 16px", fontSize: 12.5, fontWeight: 800, cursor: "pointer", whiteSpace: "nowrap", boxShadow: "0 4px 14px rgba(109,40,217,0.35)" }}>
          + Thêm module
        </button>
      </div>
    </div>
  );
}

function ProjectWorkspace({ project, projects, tasks, projectTab, setProjectTab, onBack, onCycle, onSetStatus, onOpenDetail, onRemoveTask, onUpdateDesc, onAddAttachments, onRemoveAttachment, onUpdateProject, onSyncLessonTask, openAddModal, onReorder } ) {
  const [habitDraft, setHabitDraft] = useState("");
  const [descDraft, setDescDraft] = useState(project.desc || "");
  const [sortMode, setSortMode] = useState("deadline");
  const fileInputRef = React.useRef(null);
  useEffect(() => { setDescDraft(project.desc || ""); }, [project.id]);
  const tabs = project.id === "standalone" 
    ? [{ id: "kanban", label: "Danh sách Việc lẻ" }]
    : [{ id: "kanban", label: "Danh sách Công việc" }, { id: "plan", label: "Lên Kế Hoạch" }, { id: "notes", label: "Ghi chú & Tài liệu" }];
  return (
    <div>
      <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: "#6366f1", fontSize: 12.5, fontWeight: 600, cursor: "pointer", marginBottom: 12 }}>
        <ArrowLeft size={14} /> Quay lại Dự Án
      </button>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
        <div style={{ width: 40, height: 40, borderRadius: 12, background: project.grad }} />
        <div><div style={{ fontWeight: 700, fontSize: 16 }}>{project.name}</div><div style={{ fontSize: 11.5, color: "var(--wf-text-faint)" }}>🔒 Không gian riêng tư</div></div>
      </div>

      {/* Mô tả dự án + tệp đính kèm */}
      <div className="wf-card" style={{ borderRadius: 16, padding: 16, marginBottom: 16 }}>
        <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--wf-text-secondary)", marginBottom: 6, display: "flex", alignItems: "center", gap: 5 }}><FileText size={13} /> Mô tả dự án</div>
        <textarea value={descDraft} onChange={(e) => setDescDraft(e.target.value)}
          onBlur={() => onUpdateDesc && onUpdateDesc(project.id, descDraft)}
          placeholder="Thêm mô tả cho dự án này: mục tiêu, phạm vi, ghi chú quan trọng..." rows={2} className="wf-input"
          style={{ width: "100%", border: "1px solid var(--wf-border)", borderRadius: 10, padding: "9px 12px", fontSize: 12.5, fontFamily: "inherit", resize: "vertical", outline: "none", marginBottom: 12 }} />

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--wf-text-secondary)", display: "flex", alignItems: "center", gap: 5 }}><Paperclip size={13} /> Tệp đính kèm {project.attachments?.length > 0 && `(${project.attachments.length})`}</div>
          <button onClick={() => fileInputRef.current?.click()} className="wf-btn" style={{ ...secondaryBtnStyle, fontSize: 11, padding: "4px 10px", display: "flex", alignItems: "center", gap: 4 }}><Plus size={11} /> Đính kèm</button>
          <input ref={fileInputRef} type="file" multiple hidden onChange={(e) => { onAddAttachments && onAddAttachments(project.id, e.target.files); e.target.value = ""; }} />
        </div>
        {project.attachments?.length > 0 ? (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 6 }}>
            {project.attachments.map((a) => (
              <div key={a.id} className="wf-row" style={{ display: "flex", alignItems: "center", gap: 8, background: "var(--wf-hover-soft)", borderRadius: 9, padding: "7px 10px" }}>
                <FileText size={14} style={{ color: "#6366f1", flexShrink: 0 }} />
                <a href={a.url} download={a.name} target="_blank" rel="noreferrer" style={{ flex: 1, minWidth: 0, fontSize: 12, fontWeight: 600, color: "var(--wf-text)", textDecoration: "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.name}</a>
                <span style={{ fontSize: 10.5, color: "var(--wf-text-faint)", flexShrink: 0 }}>{formatFileSize(a.size)}</span>
                <button onClick={() => onRemoveAttachment && onRemoveAttachment(project.id, a.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", flexShrink: 0 }}><Trash2 size={12} /></button>
              </div>
            ))}
          </div>
        ) : (
          <div style={{ fontSize: 11.5, color: "var(--wf-text-faint)" }}>Chưa có tệp nào được đính kèm.</div>
        )}
      </div>

      <div className="wf-tabbar-sticky">
        <SlidingTabBar tabs={tabs} active={projectTab} onChange={setProjectTab} />
      </div>

      {projectTab === "kanban" && (() => {
        const sortedTasks = [...tasks].sort((a, b) => {
          if (sortMode === "status") {
            const valA = a.status === "done" ? 1 : 0;
            const valB = b.status === "done" ? 1 : 0;
            if (valA !== valB) return valA - valB;
            return (a.due || "").localeCompare(b.due || "");
          }
          return (a.due || "").localeCompare(b.due || "");
        });
        return (
          <>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <button onClick={() => openAddModal && openAddModal("personal", project.name)} style={{ display: "flex", alignItems: "center", gap: 6, background: "linear-gradient(135deg,#7c3aed,#a855f7)", color: "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontWeight: 700, fontSize: 12.5, cursor: "pointer", boxShadow: "0 4px 12px rgba(124,58,237,0.25)" }}>
                <Plus size={14} /> Thêm công việc vào dự án
              </button>
              <select value={sortMode} onChange={(e) => setSortMode(e.target.value)} className="wf-input" style={{ width: 220, fontSize: 12, padding: "6px 10px", borderRadius: 8, outline: "none", border: "1px solid var(--wf-border-soft)", background: "var(--wf-surface)", color: "var(--wf-text)" }}>
                <option value="deadline">Sắp xếp theo Deadline</option>

  );
}

function SharedCalendarView({ project, onUpdateProject }) {
  const days = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ Nhật"];
  const hours = Array.from({ length: 15 }, (_, i) => i + 8);
  const members = project.members || ["Bạn"];
  const myName = "Bạn";
  
  const avail = project.availability || {};
  
  const simulatedAvail = React.useMemo(() => {
    const sim = {};
    members.forEach(m => {
      if (m !== myName && !avail[m]) {
        sim[m] = [];
        days.forEach(d => {
          hours.forEach(h => {
             if (Math.random() > 0.6) sim[m].push(`${d}-${h}`);
          });
        });
      }
    });
    return { ...avail, ...sim };
  }, [avail, members]);

  const [isSelecting, setIsSelecting] = useState(false);
  const [selectMode, setSelectMode] = useState(true);
  const [viewMode, setViewMode] = useState("personal");

  const toggleSlot = (d, h, forceMode) => {
    if (viewMode !== "personal") return;
    const key = `${d}-${h}`;
    let myAvail = [...(avail[myName] || [])];
    const hasSlot = myAvail.includes(key);
    
    if (forceMode === true && !hasSlot) myAvail.push(key);
    else if (forceMode === false && hasSlot) myAvail = myAvail.filter(x => x !== key);
    else if (forceMode === undefined) {
      if (hasSlot) myAvail = myAvail.filter(x => x !== key);
      else myAvail.push(key);
    }
    if(onUpdateProject) onUpdateProject({ availability: { ...avail, [myName]: myAvail } });
  };

  const onMouseDown = (d, h) => {
    if (viewMode !== "personal") return;
    setIsSelecting(true);
    const key = `${d}-${h}`;
    const myAvail = avail[myName] || [];
    const mode = !myAvail.includes(key);
    setSelectMode(mode);
    toggleSlot(d, h, mode);
  };

  const onMouseEnter = (d, h) => {
    if (viewMode !== "personal") return;
    if (isSelecting) {
      toggleSlot(d, h, selectMode);
    }
  };

  const onMouseUp = () => {
    setIsSelecting(false);
  };

  useEffect(() => {
    window.addEventListener("mouseup", onMouseUp);
    return () => window.removeEventListener("mouseup", onMouseUp);
  }, []);

  const getCellColor = (d, h) => {
    const key = `${d}-${h}`;
    if (viewMode === "personal") {
      const myAvail = avail[myName] || [];
      return myAvail.includes(key) ? "rgba(16, 185, 129, 0.8)" : "var(--wf-surface)";
    } else {
      let count = 0;
      members.forEach(m => {
         if ((simulatedAvail[m] || []).includes(key)) count++;
      });
      if (count === 0) return "var(--wf-surface)";
      const opacity = 0.2 + (count / members.length) * 0.8;
      return `rgba(16, 185, 129, ${opacity})`;
    }
  };

  const getFreeMembersList = (d, h) => {
    const key = `${d}-${h}`;
    const free = members.filter(m => (simulatedAvail[m] || []).includes(key));
    if (free.length === 0) return "Chưa có ai rảnh";
    if (free.length === members.length) return "Tất cả mọi người đều rảnh!";
    return "Những người rảnh:\n- " + free.join("\n- ");
  };

  return (
    <div style={{ marginTop: 24, userSelect: "none", background: "var(--wf-surface)", padding: 24, borderRadius: 20, boxShadow: "0 8px 20px rgba(26,32,53,0.06)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24, flexWrap: "wrap", gap: 16 }}>
        <div>
          <h3 style={{ margin: "0 0 6px", fontSize: 18, fontWeight: 800 }}>Lịch Rảnh Nhóm</h3>
          <div style={{ fontSize: 13.5, color: "var(--wf-text-muted)" }}>
            {viewMode === "personal" ? "Quét chọn khung giờ bạn rảnh để báo cho nhóm biết." : "Xem tổng hợp lịch rảnh của tất cả mọi người. Màu càng đậm càng đông người rảnh."}
          </div>
        </div>
        
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <div style={{ display: "flex", background: "var(--wf-bg)", padding: 4, borderRadius: 12, border: "1px solid var(--wf-border-soft)" }}>
            <button onClick={() => setViewMode("personal")} style={{ padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 13, background: viewMode === "personal" ? "#fff" : "transparent", color: viewMode === "personal" ? "#10b981" : "var(--wf-text-muted)", boxShadow: viewMode === "personal" ? "0 2px 8px rgba(0,0,0,0.05)" : "none", transition: "all 0.2s" }}>
              Lịch của tôi
            </button>
            <button onClick={() => setViewMode("shared")} style={{ padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 13, background: viewMode === "shared" ? "#fff" : "transparent", color: viewMode === "shared" ? "#10b981" : "var(--wf-text-muted)", boxShadow: viewMode === "shared" ? "0 2px 8px rgba(0,0,0,0.05)" : "none", transition: "all 0.2s" }}>
              Lịch chung nhóm
            </button>
          </div>
        </div>
      </div>
      
      {viewMode === "shared" && (
        <div style={{ display: "flex", gap: 16, alignItems: "center", fontSize: 12, fontWeight: 600, marginBottom: 16, background: "rgba(16,185,129,0.05)", padding: "10px 16px", borderRadius: 10, color: "var(--wf-text-secondary)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}><div style={{ width: 14, height: 14, background: "var(--wf-surface)", border: "1px solid var(--wf-border-soft)", borderRadius: 4 }}/>Ít người rảnh</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}><div style={{ width: 14, height: 14, background: "rgba(16, 185, 129, 0.5)", borderRadius: 4 }}/>Trung bình</div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}><div style={{ width: 14, height: 14, background: "rgba(16, 185, 129, 1)", borderRadius: 4 }}/>Đông đủ</div>
        </div>
      )}
      
      <div style={{ overflowX: "auto" }} onMouseLeave={onMouseUp}>
        <table style={{ width: "100%", borderCollapse: "separate", borderSpacing: "2px", minWidth: 600 }}>
          <thead>
            <tr>
              <th style={{ width: 60 }}></th>
              {days.map(d => <th key={d} style={{ padding: "10px 4px", fontSize: 13, fontWeight: 700, color: "var(--wf-text-secondary)", textAlign: "center" }}>{d}</th>)}
            </tr>
          </thead>
          <tbody>
            {hours.map(h => (
              <tr key={h}>
                <td style={{ fontSize: 11, fontWeight: 700, color: "var(--wf-text-faint)", textAlign: "right", paddingRight: 10 }}>
                  {h}:00
                </td>
                {days.map(d => {
                  const key = `${d}-${h}`;
                  const myAvail = avail[myName] || [];
                  const isMine = myAvail.includes(key);
                  return (
                    <td 
                      key={key} 
                      onMouseDown={() => onMouseDown(d, h)}
                      onMouseEnter={() => onMouseEnter(d, h)}
                      style={{ padding: 2 }}
                    >
                      <div style={{ 
                        height: 28, 
                        background: getCellColor(d, h), 
                        borderRadius: 6, 
                        border: viewMode === "personal" ? "1px solid rgba(16,185,129,0.2)" : "1px solid rgba(0,0,0,0.03)",
                        cursor: viewMode === "personal" ? "crosshair" : "default",
                        transition: "background 0.1s"
                      }} title={viewMode === "personal" ? (isMine ? "Đã chọn" : "Kéo để chọn giờ rảnh") : getFreeMembersList(d, h)} />
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  const getCatColor = (catName) => {

  const getInitials = (name) => name.split(" ").map(n => n[0]).join("").toUpperCase();

    setEditingCell({ id: task.id, field, value: initValue });

         onUpdateTask(editingCell.id, { [editingCell.field]: editingCell.value });
      }
    }
    setEditingCell({ id: null, field: null, value: "" });

  const handleKeyDown = (e) => {

    if(e.key === "Escape") setEditingCell({ id: null, field: null, value: "" });

  const handleTickMember = (taskId, memberName) => {
    const task = tasks.find(t => t.id === taskId);

    let completedMembers = task.completedMembers || [];

               <div key={m} title={m} style={{ width: 28, height: 28, borderRadius: "50%", background: "linear-gradient(135deg,#6366f1,#a855f7)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, border: "2px solid var(--wf-surface)", marginLeft: i > 0 ? -8 : 0, boxShadow: "0 2px 5px rgba(0,0,0,0.1)" }}>

              <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 12, color: "var(--wf-text-faint)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span>Danh sách thành viên</span>
                <span style={{ background: "var(--wf-bg)", padding: "2px 6px", borderRadius: 10, fontSize: 10 }}>{project.members.length}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {project.members.map(m => (
                  <div key={m} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 8px", background: "var(--wf-bg)", borderRadius: 8 }}>
                    <div style={{ width: 26, height: 26, borderRadius: "50%", background: "linear-gradient(135deg,#6366f1,#a855f7)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700 }}>
                      {getInitials(m)}
                    </div>
                    <div style={{ fontSize: 12.5, fontWeight: 600 }}>{m}</div>
                  </div>
                ))}
              </div>

              {friends && friends.filter(f => !project.members.includes(f.name)).length > 0 && (
                <>
                  <div style={{ fontSize: 12, fontWeight: 700, margin: "16px 0 12px 0", color: "var(--wf-text-faint)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span>Mời bạn bè</span>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {friends.filter(f => !project.members.includes(f.name)).map(f => (
                      <div key={f.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "6px 8px", background: "var(--wf-bg)", borderRadius: 8, cursor: "pointer" }}
                           onClick={(e) => { e.stopPropagation(); onUpdateProject({ members: [...project.members, f.name] }); }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <div style={{ width: 26, height: 26, borderRadius: "50%", background: "linear-gradient(135deg,#6366f1,#a855f7)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700 }}>
                            {getInitials(f.name)}
                          </div>
                          <div style={{ fontSize: 12.5, fontWeight: 600 }}>{f.name}</div>
                        </div>
                        <Plus size={14} color="var(--wf-text-muted)" />
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>
          )}
        </div>
      </div>

      <div style={{ marginBottom: 20 }}>
        <textarea className="wf-input" placeholder="Mô tả nhóm..." value={descDraft} onChange={(e) => setDescDraft(e.target.value)} onBlur={() => onUpdateProject({ desc: descDraft })}
          style={{ width: "100%", border: "1px solid var(--wf-border)", borderRadius: 12, padding: "10px 14px", fontSize: 13, minHeight: 60, resize: "vertical", outline: "none" }} />
      </div>

      <SlidingTabBar tabs={tabs} active={projectTab} onChange={setProjectTab} />

      {projectTab === "nhiemvu" && (
        <div style={{ marginTop: 24, overflowX: "auto", border: "1px solid var(--wf-border)", borderRadius: 12, background: "var(--wf-surface)" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, textAlign: "left", whiteSpace: "nowrap" }}>
            <thead>
              <tr style={{ borderBottom: "1px solid var(--wf-border)", color: "var(--wf-text-faint)" }}>
                <th style={{ padding: "12px 16px", fontWeight: 600 }}>Chuyên mục</th>
                <th style={{ padding: "12px 16px", fontWeight: 600 }}>Công việc cụ thể</th>
                <th style={{ padding: "12px 16px", fontWeight: 600 }}>Tham gia</th>
                <th style={{ padding: "12px 16px", fontWeight: 600 }}>Ngày làm</th>
                {project.members.map(m => <th key={`chk-${m}`} style={{ padding: "12px 16px", fontWeight: 600 }}>☑ ({getInitials(m)})</th>)}
              </tr>
            </thead>
            <tbody>
              {sortByDone(tasks).map(t => (
                <tr key={t.id} style={{ borderBottom: "1px solid var(--wf-border-soft)", background: "var(--wf-bg)" }}>
                  <td style={{ padding: "12px 16px" }}>
                    {editingCell.id === t.id && editingCell.field === 'category' ? (
                      <select autoFocus value={editingCell.value} onChange={e=>{
                        onUpdateTask(t.id, { category: e.target.value });
                        setEditingCell({ id: null, field: null, value: "" });
                      }} onBlur={() => setEditingCell({ id: null, field: null, value: "" })} style={{ width: 100, border: "1px solid var(--wf-border)", padding: "4px 8px", borderRadius: 6, fontSize: 11, fontFamily: "inherit" }}>
                        <option value="">Chọn...</option>
                        {projectCategories.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    ) : (
                      (() => {
                        const cat = t.category || t.project || "Chung";
                        const { c: tc, b: tb } = getCatColor(cat);
                        return (
                          <span style={{ background: tb, color: tc, padding: "4px 10px", borderRadius: 6, fontSize: 11, fontWeight: 700, cursor: "pointer" }} onClick={() => startEdit(t, 'category', cat)}>
                            {cat}
                          </span>
                        );
                      })()
                    )}
                  </td>
                  <td style={{ padding: "12px 16px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, fontWeight: 500 }}>
                      <FileText size={14} opacity={0.6} /> 
                      {editingCell.id === t.id && editingCell.field === 'title' ? (
                        <input autoFocus value={editingCell.value} onChange={e=>setEditingCell({...editingCell, value: e.target.value})} onBlur={commitEdit} onKeyDown={handleKeyDown} style={{ width: "100%", minWidth: 150, border: "1px solid var(--wf-border)", padding: "4px 8px", borderRadius: 6, fontSize: 13 }} />
                      ) : (
                        <span style={{ cursor: "pointer", flex: 1 }} onClick={() => startEdit(t, 'title', t.title)}>{t.title}</span>
                      )}
                    </div>
                    <div style={{ paddingLeft: 22, marginTop: 6, display: "flex", flexDirection: "column", gap: 4 }}>
                      {t.subtasks && t.subtasks.map((st, idx) => (
                        <div key={idx} style={{ fontSize: 11.5, color: st.done ? "#10b981" : "var(--wf-text-muted)", display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }} onClick={() => { const newSt = [...t.subtasks]; newSt[idx].done = !newSt[idx].done; onUpdateTask(t.id, { subtasks: newSt }); }}>
                           {st.done ? <Check size={12} color="#10b981" /> : <div style={{width:10, height:10, border:"1.5px solid var(--wf-border)", borderRadius:2}}/>} {st.t}
                        </div>
                      ))}
                      <div style={{ fontSize: 11, color: "#6366f1", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4, marginTop: 2, opacity: 0.8 }} onClick={() => { const newSt = [...(t.subtasks||[]), { t: "Subtask mới", done: false }]; onUpdateTask(t.id, { subtasks: newSt }); }}>
                        <Plus size={10} /> Thêm việc nhỏ
                      </div>
                    </div>
                  </td>
                  <td style={{ padding: "12px 16px", fontSize: 12, color: "var(--wf-text-secondary)", fontWeight: 500 }}>
                    {editingCell.id === t.id && editingCell.field === 'assignees' ? (
                      <input autoFocus value={editingCell.value} onChange={e=>setEditingCell({...editingCell, value: e.target.value})} onBlur={commitEdit} onKeyDown={handleKeyDown} style={{ width: 120, border: "1px solid var(--wf-border)", padding: "4px 8px", borderRadius: 6, fontSize: 12 }} />
                    ) : (
                      <div style={{ cursor: "pointer", display: "flex", flexWrap: "wrap", gap: 6, minWidth: 40, minHeight: 20 }} onClick={() => startEdit(t, 'assignees', t.assignees ? t.assignees.join(", ") : (t.owner || project.members.slice(0,2).join(", ")))}>
                        {(() => {
                          const list = t.assignees || (t.owner ? [t.owner] : project.members.slice(0,2));
                          const colors = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899", "#14b8a6", "#f43f5e", "#0ea5e9", "#84cc16"];
                          const getBg = (name) => {
                            if (!name) return colors[0];
                            const idx = (project.members || []).indexOf(name);
                            if (idx !== -1) return colors[idx % colors.length];
                            let sum = 0; for (let i=0; i<name.length; i++) sum += name.charCodeAt(i);
                            return colors[sum % colors.length];
                          };
                          if (!list || list.length === 0) return <span style={{ color: "var(--wf-text-faint)", fontStyle: "italic" }}>Chưa giao</span>;
                          return list.map((name, i) => (
                            <span key={i} style={{ background: getBg(name) + "1a", color: getBg(name), padding: "2px 8px", borderRadius: 12, fontSize: 11, fontWeight: 700, border: `1px solid ${getBg(name)}40`, whiteSpace: "nowrap" }}>
                              {name}
                            </span>
                          ));
                        })()}
                      </div>
                    )}
                  </td>
                  <td style={{ padding: "12px 16px", fontSize: 12.5 }}>
                    {editingCell.id === t.id && editingCell.field === 'due' ? (
                      <input type="date" autoFocus value={editingCell.value} onChange={e=>setEditingCell({...editingCell, value: e.target.value})} onBlur={commitEdit} onKeyDown={handleKeyDown} style={{ border: "1px solid var(--wf-border)", padding: "2px 4px", borderRadius: 6, fontSize: 12 }} />
                    ) : (
                      <span style={{ cursor: "pointer" }} onClick={() => startEdit(t, 'due', t.due)}>{t.due}</span>
                    )}
                  </td>
                  {project.members.map(m => {
                    const isDone = (t.completedMembers || []).includes(m);
                    return (
                      <td key={`chk-${m}`} style={{ padding: "12px 16px" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <input type="checkbox" checked={isDone} onChange={() => handleTickMember(t.id, m)} style={{ cursor: "pointer", width: 16, height: 16, accentColor: "#6366f1" }} />
                          {isDone && (
                            <div style={{ display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
                              <button onClick={(e) => { e.stopPropagation(); document.getElementById(`proof-upload-${t.id}-${m}`).click(); }} title="Tải lên minh chứng" style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 22, height: 22, background: "rgba(99,102,241,0.1)", color: "#6366f1", border: "1px dashed #6366f1", borderRadius: 4, cursor: "pointer" }}>
                                <Plus size={14} />
                              </button>
                              <input id={`proof-upload-${t.id}-${m}`} type="file" style={{ display: "none" }} onChange={(e) => {
                                if (e.target.files && e.target.files[0]) {
                                  const fileUrl = URL.createObjectURL(e.target.files[0]);
                                  const proofs = t.proofs || {};
                                  if (onUpdateTask) onUpdateTask(t.id, { proofs: { ...proofs, [m]: { name: e.target.files[0].name, url: fileUrl } } });
                                }
                              }} />
                              {t.proofs && t.proofs[m] && (
                                <a href={t.proofs[m].url} target="_blank" rel="noreferrer" title={t.proofs[m].name} style={{ display: "block", width: 16, height: 22, background: "#e2e8f0", borderRadius: 3, boxShadow: "0 1px 2px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(0,0,0,0.05)", overflow: "hidden" }}>
                                  <div style={{ background: "#10b981", width: "100%", height: "4px" }} />
                                </a>
                              )}
                            </div>
                          )}
                        </div>
                      </td>
                    );
                  })}
                </tr>
              ))}
              {tasks.length === 0 && (
                <tr><td colSpan={4 + project.members.length} style={{ textAlign: "center", padding: 40, color: "var(--wf-text-faint)" }}>Chưa có nhiệm vụ nào cho dự án này.</td></tr>
              )}
              <tr>
                <td colSpan={4 + project.members.length} style={{ padding: "12px 16px", borderTop: "1px solid var(--wf-border-soft)" }}>
                  <button onClick={() => {
                    if (onAddTask) {
                      onAddTask({ id: Date.now(), title: "Nhiệm vụ mới", type: "team", project: project.name, category: "Chung", priority: "Vừa", status: "todo", due: new Date().toISOString().slice(0,10), assignees: [], completedMembers: [], subtasks: [], comments: [] });
                    }
                  }} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: "var(--wf-text-faint)", fontSize: 13, fontWeight: 600, cursor: "pointer", padding: "6px 0", transition: "color 0.2s" }} onMouseOver={(e) => e.currentTarget.style.color = "#6366f1"} onMouseOut={(e) => e.currentTarget.style.color = "var(--wf-text-faint)"}>
                    <Plus size={14} /> Thêm nhiệm vụ mới
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      )}

      {projectTab === "plan" && (
        <div style={{ marginTop: 24 }}>
          <CoursePlannerView project={project} onUpdateProject={onUpdateProject} onSyncLessonTask={() => alert("Mô phỏng đồng bộ!")} />
        </div>
      )}

      {projectTab === "schedule" && (
        <SharedCalendarView project={project} onUpdateProject={onUpdateProject} />
      )}

      {projectTab === "leaderboard" && (() => {
        const stats = project.members.map(m => {
          let xp = 0;
          let datesDone = new Set();
          tasks.forEach(t => {
            if ((t.completedMembers || []).includes(m) && t.due) {
              datesDone.add(t.due);
              xp += 10;
            }
          });
          const sortedDates = Array.from(datesDone).sort((a,b) => new Date(b) - new Date(a));
          const todayStrLocal = new Date().toISOString().slice(0,10);
          const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
          const yesterdayStrLocal = yesterday.toISOString().slice(0,10);

          let currentStreak = 0;
          let checkDate = new Date(); checkDate.setHours(0,0,0,0);
          
          if (sortedDates.includes(todayStrLocal)) {
          } else if (sortedDates.includes(yesterdayStrLocal)) {
            checkDate.setDate(checkDate.getDate() - 1);
          } else {
            checkDate = null;
          }
          
          if (checkDate) {
            while (sortedDates.includes(new Date(checkDate.getTime() - checkDate.getTimezoneOffset() * 60000).toISOString().split('T')[0])) {
              currentStreak++;
              checkDate.setDate(checkDate.getDate() - 1);
            }
          }
          return { name: m, xp, streak: currentStreak };
        }).sort((a,b) => b.streak - a.streak || b.xp - a.xp);
        
        return (
          <div style={{ marginTop: 24, padding: 30, background: "var(--wf-surface)", borderRadius: 20, boxShadow: "0 8px 24px rgba(0,0,0,0.06)" }}>
            <h3 style={{ margin: "0 0 24px", fontSize: 20, fontWeight: 800, display: "flex", alignItems: "center", gap: 10 }}>
              <Zap size={24} color="#f59e0b" /> Bảng Xếp Hạng Độ Chăm Chỉ
            </h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {stats.map((s, idx) => (
                <div key={s.name} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 24px", background: idx === 0 ? "linear-gradient(135deg, rgba(245,158,11,0.1), rgba(239,68,68,0.05))" : "var(--wf-bg)", borderRadius: 16, border: idx === 0 ? "2px solid rgba(245,158,11,0.3)" : "1px solid var(--wf-border-soft)", transition: "transform 0.2s" }} onMouseEnter={e=>e.currentTarget.style.transform="translateY(-2px)"} onMouseLeave={e=>e.currentTarget.style.transform="translateY(0)"}>
                  <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                    <div style={{ width: 40, height: 40, borderRadius: "50%", background: idx === 0 ? "#f59e0b" : idx === 1 ? "#94a3b8" : idx === 2 ? "#b45309" : "#e2e8f0", color: idx <= 2 ? "#fff" : "var(--wf-text-muted)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 16, boxShadow: idx <= 2 ? "0 4px 10px rgba(0,0,0,0.1)" : "none" }}>
                      {idx + 1}
                    </div>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: 16, color: idx === 0 ? "#b45309" : "var(--wf-text)", display: "flex", alignItems: "center", gap: 8 }}>
                        {s.name} {idx === 0 && "🏆"}
                        <span style={{ fontSize: 11, background: idx === 0 ? "rgba(245,158,11,0.2)" : "rgba(99,102,241,0.1)", color: idx === 0 ? "#b45309" : "#6366f1", padding: "2px 8px", borderRadius: 12, fontWeight: 800, border: idx === 0 ? "1px solid rgba(245,158,11,0.3)" : "1px solid rgba(99,102,241,0.2)" }}>
                          Lv.{Math.floor(s.xp / 50) + 1}
                        </span>
                      </div>
                      <div style={{ fontSize: 13, color: "var(--wf-text-muted)", marginTop: 4 }}>{s.xp} điểm kinh nghiệm</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, background: s.streak > 0 ? "rgba(239,68,68,0.1)" : "var(--wf-surface)", color: s.streak > 0 ? "#ef4444" : "var(--wf-text-muted)", padding: "8px 16px", borderRadius: 24, fontWeight: 800, fontSize: 15 }}>
                    <Flame size={18} fill={s.streak > 0 ? "#ef4444" : "transparent"} color={s.streak > 0 ? "#ef4444" : "var(--wf-text-muted)"} /> {s.streak} ngày streak
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      })()}

      {projectTab === "notes" && (
        <div style={{ marginTop: 24 }}>
          <textarea className="wf-input" placeholder="Ghi chú chung cho dự án nhóm..." value={project.notes || ""} onChange={(e) => onUpdateProject({ notes: e.target.value })}
            style={{ width: "100%", border: "1px solid var(--wf-border)", borderRadius: 12, padding: "16px", fontSize: 14, minHeight: 400, resize: "vertical", outline: "none", lineHeight: 1.6 }} />
        </div>
      )}
    </div>
  );
}

function TaskDetailModal({ task, onClose, onToggleSub, commentDraft, setCommentDraft, onAddComment, onCycle, onPomodoro, onRemove, onUpdateDesc, onAddAttachments, onRemoveAttachment, projects, showTeam, onUpdateProject }) {

    <div onClick={onClose} className="wf-modal-overlay" style={{ position: "fixed", inset: 0, background: "rgba(20,20,30,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 55 }}>
      <div className="wf-modal wf-scrollbar" onClick={(e) => e.stopPropagation()} style={{ background: "var(--wf-surface)", borderRadius: 18, padding: 24, width: 480, maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
          <div style={{ flex: 1, minWidth: 0, paddingRight: 12 }}>

              <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: task.type === "personal" ? "#f3f0fd" : "#ecfdf5", color: task.type === "personal" ? "#6366f1" : "#10b981", fontSize: 10.5, fontWeight: 700, borderRadius: 8, padding: "3px 8px" }}>
                {task.type === "personal" ? <Lock size={11} /> : <Users size={11} />}{task.type === "personal" ? (task.project && task.project !== "Việc lẻ" ? `📁 ${task.project}` : "📋 Việc lẻ") : `🏢 ${task.project}`}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 4, background: "var(--wf-hover-soft)", padding: "2px 8px", borderRadius: 8, border: "1px solid var(--wf-border-soft)" }}>
                <span style={{ fontSize: 10.5, color: "var(--wf-text-muted)", fontWeight: 600 }}>Chuyển sang:</span>
                <select value={task.project || "Việc lẻ"} onChange={(e) => onUpdateProject && onUpdateProject(task.id, e.target.value)}
                  style={{ background: "transparent", border: "none", color: "var(--wf-accent)", fontSize: 11, fontWeight: 700, cursor: "pointer", outline: "none", padding: "1px 0" }}>
                  <option value="Việc lẻ">📋 Việc lẻ (Không thuộc dự án)</option>
                  {projects?.map(p => (
                    <option key={p.id} value={p.name}>📁 Dự án: {p.name}</option>
                  ))}
                  {showTeam && <option value="Team Project">🏢 Nhóm: Team Project</option>}
                </select>
              </div>
            </div>
            <h3 className="wf-heading" style={{ margin: 0, fontSize: 18, fontWeight: 700 }}>{task.title}</h3>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-text-muted)", flexShrink: 0 }}><X size={18} /></button>
        </div>
        <div style={{ fontSize: 12, color: "var(--wf-text-faint)", marginBottom: 14 }}>Hạn: {task.due} {task.due < todayStr && task.status !== "done" ? "· ⚠️ Trễ hạn" : ""}</div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <button onClick={() => onCycle(task.id)} style={badgeStyle(statusColor[task.status])}>{statusLabel[task.status]}</button>
          <button onClick={() => onPomodoro(task.id)} style={{ ...secondaryBtnStyle, display: "flex", alignItems: "center", gap: 5, padding: "6px 12px" }}><Timer size={13} /> Pomodoro 25p</button>
          <button onClick={() => onRemove(task.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-border)", marginLeft: "auto" }}><Trash2 size={15} /></button>
        </div>

        {/* Description */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--wf-text-secondary)", marginBottom: 6, display: "flex", alignItems: "center", gap: 5 }}><FileText size={13} /> Mô tả công việc</div>
          <textarea value={descDraft} onChange={(e) => setDescDraft(e.target.value)}
            onBlur={() => onUpdateDesc && onUpdateDesc(task.id, descDraft)}
            placeholder="Thêm mô tả chi tiết cho công việc này..." rows={3} className="wf-input"
            style={{ width: "100%", border: "1px solid var(--wf-border)", borderRadius: 10, padding: "9px 12px", fontSize: 12.5, fontFamily: "inherit", resize: "vertical", outline: "none" }} />
        </div>

        {/* Attachments */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--wf-text-secondary)", display: "flex", alignItems: "center", gap: 5 }}><Paperclip size={13} /> Tệp đính kèm {task.attachments?.length > 0 && `(${task.attachments.length})`}</div>
            <button onClick={() => fileInputRef.current?.click()} className="wf-btn" style={{ ...secondaryBtnStyle, fontSize: 11, padding: "4px 10px", display: "flex", alignItems: "center", gap: 4 }}><Plus size={11} /> Đính kèm</button>
            <input ref={fileInputRef} type="file" multiple hidden onChange={(e) => { onAddAttachments && onAddAttachments(task.id, e.target.files); e.target.value = ""; }} />
          </div>

function YearlyHeatmap({ dataMap, color = "#10b981" }) {
  // dataMap is { "YYYY-MM-DD": value }
  const today = new Date(todayStr);
  const days = [];
  for (let i = 364; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }

  // group into weeks
  const weeks = [];
  let currentWeek = [];
  days.forEach(d => {
    currentWeek.push(d);
    if (new Date(d).getDay() === 0) { // Sunday
      weeks.push(currentWeek);
      currentWeek = [];
    }
  });
  if (currentWeek.length > 0) weeks.push(currentWeek);

  // Pad first week with nulls to align correctly
  if (weeks.length > 0 && weeks[0].length < 7) {
    const padding = Array(7 - weeks[0].length).fill(null);
    weeks[0] = [...padding, ...weeks[0]];
  }
  // Pad last week with nulls
  if (weeks.length > 0 && weeks[weeks.length-1].length < 7) {
    const padding = Array(7 - weeks[weeks.length-1].length).fill(null);
    weeks[weeks.length-1] = [...weeks[weeks.length-1], ...padding];
  }

  const maxVal = Math.max(1, ...Object.values(dataMap));

  return (
    <div style={{ display: "flex", gap: 3, overflowX: "auto", paddingBottom: 10 }} className="wf-scrollbar">
      {weeks.map((week, wi) => (
        <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
          {week.map((day, di) => {
            if (!day) return <div key={di} style={{ width: 12, height: 12 }} />;
            const val = dataMap[day] || 0;
            const opacity = val === 0 ? 0.05 : Math.max(0.2, val / maxVal);
            return (
              <div key={day} title={`${day}: ${val}`} style={{ width: 12, height: 12, borderRadius: 3, background: val ? color : "var(--wf-border-soft)", opacity: val ? opacity : 1, cursor: "help" }} />
            );
          })}
        </div>
      ))}
    </div>
  );
}

function FocusRing({ progress, color, size = 220, stroke = 14, trackColor = "#eef1fb", children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={trackColor} strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c * (1 - progress)} style={{ transition: "stroke-dashoffset 0.3s linear, stroke 0.3s ease" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column" }}>
        {children}
      </div>
    </div>
  );
}

  const tagsCount = {};
  focusLog.filter(l => l.type === "work").forEach(l => {
    const t = l.tag || "Khác";

            <div style={{ fontSize: 22, fontWeight: 900, color: "#f59e0b", display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}><Flame size={18} />{stats.streak}</div>
            <div style={{ fontSize: 11, color: "var(--wf-text-faint)" }}>Ngày liên tiếp</div>
          </div>
        </div>

        <div className="wf-pomo-chart-grid">
          <div className="wf-card" style={{ borderRadius: 16, padding: 18 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}><TrendingUp size={15} color="#6366f1" /> 7 ngày qua</div>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 80 }}>
              {stats.last7.map((d) => (
                <div key={d.day} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                  <div style={{ fontSize: 9, color: "var(--wf-text-faint)", fontWeight: 700 }}>{d.minutes > 0 ? `${d.minutes}p` : ""}</div>
                  <div style={{ width: "100%", maxWidth: 20, height: Math.max(4, (d.minutes / maxMinutes) * 55), background: d.date === todayStr ? "linear-gradient(180deg,#818cf8,#6366f1)" : "linear-gradient(180deg,#c7d2fe,#a5b4fc)", borderRadius: 4, transition: "height 0.3s ease" }} />
                </div>
              ))}
            </div>
          </div>
          <div className="wf-card" style={{ borderRadius: 16, padding: 18, display: "flex", flexDirection: "column" }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}><PieChart size={15} color="#ec4899" /> Phân bổ thời gian</div>
            <div style={{ display: "flex", alignItems: "center", gap: 14, flex: 1 }}>
              <div style={{ width: 64, height: 64, borderRadius: "50%", background: Object.keys(tagsCount).length > 0 ? `conic-gradient(${pieGradient})` : "#e5e7eb", flexShrink: 0, boxShadow: "inset 0 2px 6px rgba(0,0,0,0.06)" }}></div>
              <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 4, overflowY: "auto", maxHeight: 70 }} className="wf-scrollbar">
                {Object.keys(tagsCount).length === 0 ? <span style={{ fontSize: 11, color: "var(--wf-text-faint)" }}>Chưa có tag nào</span> : 
                 Object.entries(tagsCount).map(([t, mins]) => (
