                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: tagColors[t] || "#9ca3af" }}></div>
                    <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t}</span>
                    <span>{Math.round(mins/totalTagMins*100)}%</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        <div className="wf-card wf-scrollbar" style={{ borderRadius: 16, padding: 18, maxHeight: 260, overflowY: "auto" }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}><Calendar size={15} color="#6366f1" /> Nhật ký phiên gần đây</div>
            <button onClick={() => setLogExpanded(true)} className="wf-icon-btn" title="Phóng to nhật ký" style={{ background: "rgba(99,102,241,0.1)", border: "none", cursor: "pointer", color: "#6366f1", padding: 4, borderRadius: 6, display: "flex" }}><Maximize2 size={14} /></button>
          </div>
          {focusLog.length === 0 && <div style={{ fontSize: 12.5, color: "var(--wf-text-faint)" }}>Chưa có phiên nào được ghi nhận. Bắt đầu Pomodoro đầu tiên nào!</div>}
          {focusLog.slice(0, 30).map((l) => {
            const m = focusModeMeta[l.type];
            const isExpanded = expandedId === l.id;
            const hasReflection = l.type === "work" && (l.rating > 0 || l.done || l.difficulty || l.solution || l.tag);
            return (
              <div key={l.id} style={{ borderBottom: "1px solid #f5f7ff" }}>
                <div className="wf-row" onClick={() => l.type === "work" && setExpandedId(isExpanded ? null : l.id)}
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px", cursor: l.type === "work" ? "pointer" : "default" }}>
                  <div style={{ width: 28, height: 28, borderRadius: 8, background: `${m.color}18`, display: "flex", alignItems: "center", justifyContent: "center" }}><m.icon size={13} color={m.color} /></div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <div style={{ fontSize: 13, fontWeight: 700 }}>{l.type === "work" ? l.taskTitle || "Phiên tự do" : m.label}</div>
                      {l.tag && <span style={{ fontSize: 9.5, background: tagColors[l.tag] || "#9ca3af", color: "#fff", padding: "2px 6px", borderRadius: 8, fontWeight: 700 }}>{l.tag}</span>}
                    </div>
                    <div style={{ fontSize: 11, color: "var(--wf-text-muted)", marginTop: 2 }}>
                      {new Date(l.completedAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })} • {l.minutes} phút
                    </div>
                  </div>
                  {l.type === "work" && (
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      {hasReflection && <div style={{ fontSize: 11, background: "#f3e8ff", color: "#9333ea", padding: "2px 8px", borderRadius: 10, fontWeight: 700 }}>Đã note</div>}
                      <button onClick={(e) => { e.stopPropagation(); onReflect(l.id); }} style={{ background: "none", border: "none", color: "#6366f1", fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}>✏️ Ghi chú</button>
                    </div>
                  )}
                </div>
                {isExpanded && l.type === "work" && (
                  <div style={{ padding: "0 10px 14px 50px", animation: "wfSlideUp 0.2s ease" }}>
                    <div style={{ background: "var(--wf-page-bg)", borderRadius: 10, padding: 12 }}>
                      {l.rating > 0 && <div style={{ marginBottom: 6, display: "flex", gap: 2 }}>{Array(5).fill(0).map((_, i) => <Star key={i} size={11} color={i < l.rating ? "#f59e0b" : "#e5e7eb"} fill={i < l.rating ? "#f59e0b" : "none"} />)}</div>}
                      {l.done && <div style={{ fontSize: 12, marginBottom: 4 }}><span style={{ fontWeight: 700, color: "var(--wf-text-secondary)" }}>Đã làm:</span> {l.done}</div>}
                      {l.difficulty && <div style={{ fontSize: 12, marginBottom: 4 }}><span style={{ fontWeight: 700, color: "var(--wf-text-secondary)" }}>Khó khăn:</span> {l.difficulty}</div>}
                      {l.solution && <div style={{ fontSize: 12 }}><span style={{ fontWeight: 700, color: "var(--wf-text-secondary)" }}>Giải pháp:</span> {l.solution}</div>}
                      {!hasReflection && <div style={{ fontSize: 12, color: "var(--wf-text-faint)", fontStyle: "italic" }}>Chưa có ghi chú nào. Bấm "Ghi chú" để thêm nhật ký.</div>}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Full Focus Log Modal */}
      {logExpanded && (
        <div className="wf-modal-overlay" style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.5)", backdropFilter: "blur(4px)" }} onClick={() => setLogExpanded(false)}>
          <div className="wf-modal wf-scrollbar" style={{ background: "var(--wf-surface)", width: 1400, maxWidth: "98vw", maxHeight: "96vh", borderRadius: 24, padding: "32px 40px", overflowY: "auto", position: "relative" }} onClick={e => e.stopPropagation()}>
            <button onClick={() => setLogExpanded(false)} style={{ position: "absolute", top: 20, right: 24, background: "none", border: "none", cursor: "pointer", color: "var(--wf-text-muted)" }}><X size={28} /></button>
            <h2 style={{ fontSize: 24, fontWeight: 800, color: "var(--wf-text)", marginBottom: 28, display: "flex", alignItems: "center", gap: 10 }}><Calendar size={28} color="#6366f1" /> Toàn bộ Nhật ký phiên tập trung</h2>
            
            {focusLog.length === 0 ? (
               <div style={{ fontSize: 14, color: "var(--wf-text-faint)", textAlign: "center", padding: "40px 0" }}>Chưa có nhật ký nào.</div>
            ) : (
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, textAlign: "left" }}>
                <thead>
                  <tr style={{ borderBottom: "2px solid var(--wf-border-soft)", color: "var(--wf-text-muted)", fontSize: 12 }}>
                    <th style={{ padding: "12px 8px", fontWeight: 700, width: "22%" }}>Phiên & Thời gian</th>
                    <th style={{ padding: "12px 8px", fontWeight: 700, width: "26%" }}>Đã làm</th>
                    <th style={{ padding: "12px 8px", fontWeight: 700, width: "30%" }}>Khó khăn & Giải pháp</th>
                    <th style={{ padding: "12px 8px", fontWeight: 700, width: "12%" }}>Đánh giá</th>
                    <th style={{ padding: "12px 8px", fontWeight: 700, width: "10%" }}></th>
                  </tr>
                </thead>
                <tbody>
                  {focusLog.map(l => {
                    const m = focusModeMeta[l.type];
                    return (
                      <tr key={l.id} style={{ borderBottom: "1px solid var(--wf-border-soft)", verticalAlign: "top", transition: "background 0.2s" }} className="wf-row">
                        <td style={{ padding: "16px 8px" }}>
                          <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                            <div style={{ width: 32, height: 32, borderRadius: 8, background: `${m.color}18`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><m.icon size={15} color={m.color} /></div>
                            <div>
                              <div style={{ fontSize: 14, fontWeight: 700, color: "var(--wf-text)", marginBottom: 4 }}>{l.type === "work" ? l.taskTitle || "Phiên tự do" : m.label}</div>
                              <div style={{ fontSize: 11, color: "var(--wf-text-muted)", marginBottom: 4 }}>{new Date(l.completedAt).toLocaleDateString("vi-VN")} • {new Date(l.completedAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}</div>
                              <div style={{ fontSize: 11, color: "var(--wf-text-muted)", fontWeight: 600 }}>⏳ {l.minutes} phút</div>
                              {l.tag && <div style={{ display: "inline-block", marginTop: 6, fontSize: 10, background: tagColors[l.tag] || "#9ca3af", color: "#fff", padding: "2px 6px", borderRadius: 6, fontWeight: 700 }}>{l.tag}</div>}
                            </div>
                          </div>
                        </td>
                        <td style={{ padding: "16px 8px", color: "var(--wf-text)" }}>
                          {l.done ? <div style={{ lineHeight: 1.4 }}>{l.done}</div> : <span style={{ color: "var(--wf-text-faint)", fontStyle: "italic" }}>-</span>}
                        </td>
                        <td style={{ padding: "16px 8px" }}>
                          {(l.difficulty || l.solution) ? (
                            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                              {l.difficulty && <div><span style={{ fontWeight: 700, color: "#ef4444", fontSize: 12 }}>⚠ Khó khăn:</span><br/><span style={{ lineHeight: 1.4, color: "var(--wf-text)" }}>{l.difficulty}</span></div>}
                              {l.solution && <div><span style={{ fontWeight: 700, color: "#10b981", fontSize: 12 }}>💡 Giải pháp:</span><br/><span style={{ lineHeight: 1.4, color: "var(--wf-text)" }}>{l.solution}</span></div>}
                            </div>
                          ) : <span style={{ color: "var(--wf-text-faint)", fontStyle: "italic" }}>-</span>}
                        </td>
                        <td style={{ padding: "16px 8px" }}>
                          {l.rating > 0 ? (
                            <div style={{ display: "flex", gap: 2 }}>{Array(5).fill(0).map((_, i) => <Star key={i} size={13} color={i < l.rating ? "#f59e0b" : "#e5e7eb"} fill={i < l.rating ? "#f59e0b" : "none"} />)}</div>
                          ) : <span style={{ color: "var(--wf-text-faint)", fontStyle: "italic" }}>-</span>}
                        </td>
                        <td style={{ padding: "16px 8px", textAlign: "right" }}>
                          {l.type === "work" && (
                            <button onClick={() => { setLogExpanded(false); onReflect(l.id); }} className="wf-icon-btn" style={{ background: "rgba(99,102,241,0.1)", border: "none", color: "#6366f1", fontSize: 12, fontWeight: 700, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4, padding: "6px 10px", borderRadius: 8 }}>
                              <FileText size={14} /> Sửa
                            </button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function ZenOverlay({ focusTimer, focusSettings, tasks, onStart, onPause, onReset, onSwitchMode, onExit, soundOn, setSoundOn }) {
  const meta = focusModeMeta[focusTimer.mode];
  const totalSecs = focusSettings[focusTimer.mode === "work" ? "work" : focusTimer.mode === "short" ? "short" : "long"] * 60;
  const progress = totalSecs ? 1 - focusTimer.secondsLeft / totalSecs : 0;
  const taskTitle = focusTimer.taskId ? (tasks.find((t) => t.id === focusTimer.taskId)?.title) : null;
  const quotes = ["Một phiên tại một thời điểm.", "Hơi thở sâu. Tâm trí tĩnh lặng.", "Sự tập trung là siêu năng lực của bạn.", "Chỉ cần bây giờ, chỉ cần việc này."];
  const quote = quotes[focusTimer.cycleCount % quotes.length];
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, background: focusTimer.mode === "work" ? "linear-gradient(160deg,#0b0f1f 0%,#1a1f3a 55%,#241b3f 100%)" : "linear-gradient(160deg,#052e2b 0%,#0f3d3a 55%,#0b2b3d 100%)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", animation: "wfFadeIn 0.4s ease" }}>
      <button onClick={onExit} title="Thoát Zen Mode" style={{ position: "absolute", top: 24, right: 28, background: "rgba(255,255,255,0.08)", border: "none", color: "#fff", borderRadius: 10, padding: "9px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
        <Minimize2 size={14} /> Thoát
      </button>
      <button onClick={() => setSoundOn((s) => !s)} title={soundOn ? "Tắt âm thanh" : "Bật âm thanh"} style={{ position: "absolute", top: 24, left: 28, background: "rgba(255,255,255,0.08)", border: "none", color: "#fff", borderRadius: 10, padding: "9px 10px", cursor: "pointer" }}>
        {soundOn ? <Volume2 size={16} /> : <VolumeX size={16} />}
      </button>

      <div style={{ display: "flex", gap: 8, marginBottom: 30 }}>
        {Object.entries(focusModeMeta).map(([key, m]) => (
          <button key={key} onClick={() => onSwitchMode(key)} style={{ border: "1px solid rgba(255,255,255,0.18)", background: focusTimer.mode === key ? "rgba(255,255,255,0.14)" : "transparent", color: "#fff", borderRadius: 999, padding: "6px 14px", fontSize: 11.5, fontWeight: 700, cursor: "pointer", opacity: focusTimer.mode === key ? 1 : 0.6 }}>{m.label}</button>
        ))}
      </div>

      <FocusRing progress={progress} color={meta.color} size={320} stroke={10} trackColor="rgba(255,255,255,0.12)">
        <div className="wf-heading" style={{ fontSize: 68, fontWeight: 800, color: "#fff", fontVariantNumeric: "tabular-nums" }}>{fmtClock(focusTimer.secondsLeft)}</div>
        <div style={{ fontSize: 13, fontWeight: 700, color: meta.color, marginTop: 6 }}>{meta.label}</div>
      </FocusRing>

      {taskTitle && focusTimer.mode === "work" && (
        <div style={{ marginTop: 22, color: "rgba(255,255,255,0.75)", fontSize: 14, fontWeight: 600 }}>🎯 {taskTitle}</div>
      )}
      <div style={{ marginTop: 14, color: "rgba(255,255,255,0.4)", fontSize: 13, fontStyle: "italic" }}>{quote}</div>

      <div style={{ display: "flex", gap: 14, marginTop: 34 }}>
        {!focusTimer.running ? (
          <button onClick={onStart} style={{ background: meta.color, border: "none", color: "#fff", borderRadius: 999, padding: "13px 30px", fontSize: 14, fontWeight: 800, cursor: "pointer", display: "flex", alignItems: "center", gap: 8, boxShadow: `0 10px 26px ${meta.color}55` }}><Play size={16} /> Bắt đầu</button>
        ) : (
          <button onClick={onPause} style={{ background: "rgba(255,255,255,0.14)", border: "none", color: "#fff", borderRadius: 999, padding: "13px 30px", fontSize: 14, fontWeight: 800, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}><Pause size={16} /> Tạm dừng</button>
        )}
        <button onClick={onReset} style={{ background: "rgba(255,255,255,0.08)", border: "none", color: "#fff", borderRadius: 999, padding: "13px 20px", fontSize: 13, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}><RotateCcw size={15} /> Reset</button>
      </div>
      <div style={{ marginTop: 20, color: "rgba(255,255,255,0.35)", fontSize: 11.5 }}>Chu kỳ: {focusTimer.cycleCount} phiên · Nghỉ dài sau mỗi {focusSettings.longEvery} phiên</div>
    </div>
  );
}

function StarPicker({ value, onChange, size = 26 }) {
  const [hover, setHover] = useState(0);
  return (
    <div style={{ display: "flex", gap: 4 }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <button key={n} type="button" onClick={() => onChange(n === value ? 0 : n)} onMouseEnter={() => setHover(n)} onMouseLeave={() => setHover(0)}
          style={{ background: "none", border: "none", cursor: "pointer", padding: 2 }}>
          <Star size={size} fill={n <= (hover || value) ? "#f59e0b" : "none"} color={n <= (hover || value) ? "#f59e0b" : "var(--wf-border)"} style={{ transition: "fill 0.1s ease, color 0.1s ease" }} />
        </button>
      ))}
    </div>
  );
}

function ReflectionModal({ entry, onClose, onSave }) {
  const [rating, setRating] = useState(entry.rating || 0);
  const [done, setDone] = useState(entry.done || "");
  const [difficulty, setDifficulty] = useState(entry.difficulty || "");
  const [solution, setSolution] = useState(entry.solution || "");
  const [tag, setTag] = useState(entry.tag || "");
  const [nextStep, setNextStep] = useState(entry.nextStep || "");

  const tagsList = ["#Coding", "#Reading", "#Design", "#Writing", "#Learning", "Khác"];

  return (
    <div onClick={onClose} className="wf-modal-overlay" style={{ position: "fixed", inset: 0, background: "rgba(20,20,30,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
      <div className="wf-modal" onClick={(e) => e.stopPropagation()} style={{ background: "var(--wf-surface)", borderRadius: 18, padding: 24, width: 420, maxWidth: "90vw" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <h3 className="wf-heading" style={{ margin: 0, fontSize: 17, fontWeight: 800 }}>📝 Nhật ký phiên tập trung</h3>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--wf-text-muted)" }}><X size={18} /></button>
        </div>
        {entry.taskTitle && <div style={{ fontSize: 12, color: "var(--wf-text-faint)", marginBottom: 14 }}>🎯 {entry.taskTitle} · {entry.minutes} phút</div>}

        <label style={labelStyle}>Phân loại công việc (Tag)</label>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
          {tagsList.map(t => (
            <button key={t} onClick={() => setTag(t)} style={{ background: tag === t ? "#6366f1" : "var(--wf-hover-soft)", color: tag === t ? "#fff" : "var(--wf-text-secondary)", border: tag === t ? "1px solid #6366f1" : "1px solid var(--wf-border-soft)", borderRadius: 12, padding: "5px 12px", fontSize: 11.5, fontWeight: 600, cursor: "pointer", transition: "all 0.15s ease" }}>{t}</button>
          ))}
        </div>

        <label style={labelStyle}>Đánh giá hiệu quả phiên này</label>
        <StarPicker value={rating} onChange={setRating} />

        <label style={labelStyle}>Đã làm được gì / hoàn thành gì?</label>
        <textarea value={done} onChange={(e) => setDone(e.target.value)} rows={2} placeholder="VD: Viết xong 2 endpoint, review xong 1 PR..."
          style={{ ...inputStyle, fontFamily: "inherit", resize: "vertical" }} />

        <label style={labelStyle}>Gặp khó khăn gì?</label>
        <textarea value={difficulty} onChange={(e) => setDifficulty(e.target.value)} rows={2} placeholder="VD: Bị xao nhãng, chưa rõ yêu cầu..."
          style={{ ...inputStyle, fontFamily: "inherit", resize: "vertical" }} />

        <label style={labelStyle}>Cách giải quyết nên làm sao?</label>
        <textarea value={solution} onChange={(e) => setSolution(e.target.value)} rows={2} placeholder="VD: Tắt thông báo, hỏi rõ trước khi bắt đầu..."
          style={{ ...inputStyle, fontFamily: "inherit", resize: "vertical" }} />

        <label style={labelStyle}>Ghi chú dở dang / Bước tiếp theo? (Dừng bút)</label>
        <textarea value={nextStep} onChange={(e) => setNextStep(e.target.value)} rows={2} placeholder="VD: Đang sửa dở hàm A, tý vào làm tiếp phần B..."
          style={{ ...inputStyle, fontFamily: "inherit", resize: "vertical", borderColor: "rgba(99,102,241,0.5)" }} />

        <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
          <button onClick={onClose} style={{ ...secondaryBtnStyle, flex: 1 }}>Để sau</button>
          <button onClick={() => onSave({ rating, done, difficulty, solution, tag, nextStep })} style={{ ...primaryBtnStyle, flex: 1.4 }}>Lưu nhật ký</button>
        </div>
      </div>
    </div>
  );
}

function SurpriseModal({ surprise, onClose }) {
  if (!surprise) return null;
  return (
    <div onClick={onClose} className="wf-modal-overlay" style={{ position: "fixed", inset: 0, background: "rgba(10,10,20,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 150, backdropFilter: "blur(5px)" }}>
      <div className="wf-modal" onClick={(e) => e.stopPropagation()} style={{ background: "linear-gradient(145deg, var(--wf-surface), #1e293b)", borderRadius: 24, padding: "32px", width: 400, maxWidth: "90vw", textAlign: "center", border: "1px solid rgba(255,255,255,0.1)", boxShadow: "0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(99,102,241,0.2) inset" }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>
          {surprise.type === "badge" ? "🎖️" : surprise.type === "quote" ? "✨" : "🎁"}

function ReportsView({ tasks, focusLog }) {
  const [filterWeek, setFilterWeek] = useState(0); // 0 = This week, -1 = Last week, -2 = 2 weeks ago

  // Heatmap Data (Yearly Activity)
  const heatmapData = useMemo(() => {
    const map = {};
    // Add 1 for every task completed
    tasks.filter(t => t.status === "done").forEach(t => {
      if(t.due) map[t.due] = (map[t.due] || 0) + 1;
    });
    // Add 1 for every 25m of focus
    focusLog.filter(l => l.type === "work").forEach(l => {
      map[l.date] = (map[l.date] || 0) + Math.ceil(l.minutes / 25);
    });
    return map;
  }, [tasks, focusLog]);

  // Filtered stats by week
  const filteredStats = useMemo(() => {
    const today = new Date(todayStr);
    const currentDay = today.getDay() === 0 ? 7 : today.getDay();
    
    // Start of the selected week (Monday)
    const startOfWeek = new Date(today);
    startOfWeek.setDate(today.getDate() - currentDay + 1 + (filterWeek * 7));
    const startStr = startOfWeek.toISOString().slice(0, 10);
    
    // End of the selected week (Sunday)
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 6);
    const endStr = endOfWeek.toISOString().slice(0, 10);

    const weekTasks = tasks.filter(t => t.due >= startStr && t.due <= endStr);
    const doneTasks = weekTasks.filter(t => t.status === "done");
    
    const weekFocus = focusLog.filter(l => l.type === "work" && l.date >= startStr && l.date <= endStr);
    const focusMins = weekFocus.reduce((acc, cur) => acc + cur.minutes, 0);

    return {
      startStr, endStr,
      total: weekTasks.length,
      done: doneTasks.length,
      progressPct: weekTasks.length ? Math.round((doneTasks.length / weekTasks.length) * 100) : 0,
      focusMins
    };
  }, [tasks, focusLog, filterWeek]);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      {/* Week Selector & Stats */}
      <div style={{ background: "var(--wf-surface)", borderRadius: 16, padding: 20, boxShadow: "0 8px 20px rgba(26,32,53,0.06)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 800, display: "flex", alignItems: "center", gap: 6 }}><BarChart3 size={18} color="#6366f1" /> Báo cáo theo Tuần</h3>
          <select value={filterWeek} onChange={(e) => setFilterWeek(Number(e.target.value))} style={{ ...inputStyle, width: 180, fontWeight: 600 }}>
            <option value={0}>Tuần này</option>
            <option value={-1}>Tuần trước</option>
            <option value={-2}>2 tuần trước</option>
          </select>
        </div>
        <div style={{ fontSize: 12, color: "var(--wf-text-muted)", marginBottom: 16 }}>Từ ngày {new Date(filteredStats.startStr).toLocaleDateString("vi-VN")} đến {new Date(filteredStats.endStr).toLocaleDateString("vi-VN")}</div>
        
        <div className="wf-reports-stat-grid">
          <div style={{ background: "var(--wf-hover-soft)", borderRadius: 12, padding: 16 }}>
            <div style={{ fontSize: 12, color: "var(--wf-text-faint)", marginBottom: 6 }}>Công việc phân bổ</div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>{filteredStats.total}</div>
          </div>
          <div style={{ background: "rgba(16,185,129,0.08)", borderRadius: 12, padding: 16 }}>
            <div style={{ fontSize: 12, color: "#10b981", fontWeight: 700, marginBottom: 6 }}>Đã hoàn thành</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: "#059669" }}>{filteredStats.done}</div>
          </div>
          <div style={{ background: "var(--wf-hover-soft)", borderRadius: 12, padding: 16 }}>
            <div style={{ fontSize: 12, color: "var(--wf-text-faint)", marginBottom: 6 }}>Tỷ lệ hoàn thành</div>
            <div style={{ fontSize: 22, fontWeight: 800 }}>{filteredStats.progressPct}%</div>
          </div>
          <div style={{ background: "rgba(236,72,153,0.08)", borderRadius: 12, padding: 16 }}>
            <div style={{ fontSize: 12, color: "#ec4899", fontWeight: 700, marginBottom: 6 }}>Giờ tập trung</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: "#be185d" }}>{Math.floor(filteredStats.focusMins/60)}h {filteredStats.focusMins%60}m</div>
          </div>
        </div>
      </div>

      {/* Yearly Heatmap */}
      <div style={{ background: "var(--wf-surface)", borderRadius: 16, padding: 20, boxShadow: "0 8px 20px rgba(26,32,53,0.06)" }}>
        <h3 style={{ margin: "0 0 16px", fontSize: 15, fontWeight: 800, display: "flex", alignItems: "center", gap: 6 }}><Flame size={18} color="#ec4899" /> Mật độ hoạt động (365 ngày qua)</h3>
        <div style={{ fontSize: 12, color: "var(--wf-text-muted)", marginBottom: 16 }}>Biểu đồ thể hiện mức độ hoạt động của bạn dựa trên số task hoàn thành và số phút Pomodoro. Càng đậm nghĩa là bạn càng làm việc năng suất!</div>
        <YearlyHeatmap dataMap={heatmapData} color="#ec4899" />
      </div>
    </div>
  );
}

function CalendarView({ tasks, onOpenDetail }) {
  const [currentDate, setCurrentDate] = useState(new Date());
  const [viewMode, setViewMode] = useState("month"); // "month", "week", "day"
  
  const todayStrLocal = new Date().toISOString().split("T")[0];

  const prevTime = () => {
    if (viewMode === "month") setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
    else if (viewMode === "week") setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() - 7));
    else setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() - 1));
  };
  
  const nextTime = () => {
    if (viewMode === "month") setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
    else if (viewMode === "week") setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + 7));
    else setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() + 1));
  };

  const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];

  let cells = [];
  let headerText = "";
  
  if (viewMode === "month") {
    const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
    const firstDayOfMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
    for (let i = 0; i < firstDayOfMonth; i++) cells.push(null);
    for (let i = 1; i <= daysInMonth; i++) {
       cells.push(new Date(currentDate.getFullYear(), currentDate.getMonth(), i));
    }
    while (cells.length % 7 !== 0) cells.push(null);
    headerText = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  } else if (viewMode === "week") {
    const dayOfWeek = currentDate.getDay(); 
    const startOfWeek = new Date(currentDate);
    startOfWeek.setDate(currentDate.getDate() - dayOfWeek);
    for (let i = 0; i < 7; i++) {
       const d = new Date(startOfWeek);
       d.setDate(startOfWeek.getDate() + i);
       cells.push(d);
    }
    const endOfWeek = new Date(cells[6]);
    headerText = `${cells[0].getDate()}/${cells[0].getMonth()+1} - ${endOfWeek.getDate()}/${endOfWeek.getMonth()+1}/${endOfWeek.getFullYear()}`;
  } else {
    cells = [currentDate];
    headerText = `Ngày ${currentDate.getDate()} ${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
  }

  const renderTask = (t) => (
    <div key={t.id} onClick={() => onOpenDetail(t)} style={{ fontSize: viewMode === "day" ? 13 : 11, fontWeight: 600, padding: viewMode === "day" ? "10px 14px" : "5px 8px", borderRadius: 8, background: t.status === "done" ? "rgba(16,185,129,0.1)" : "var(--wf-hover-soft)", color: t.status === "done" ? "#10b981" : "var(--wf-text-secondary)", cursor: "pointer", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", textDecoration: t.status === "done" ? "line-through" : "none", display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
      <div style={{ width: viewMode==="day"?10:6, height: viewMode==="day"?10:6, borderRadius: "50%", background: t.status === "done" ? "#10b981" : (t.type === "personal" ? "#6366f1" : "#10b981"), flexShrink: 0 }} />
      <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{t.title}</span>
    </div>
  );

  return (
    <div style={{ background: "var(--wf-surface)", borderRadius: 20, padding: 24, boxShadow: "0 8px 20px rgba(26,32,53,0.06)", minHeight: "75vh", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24, flexWrap: "wrap", gap: 12 }}>
        <h2 style={{ fontSize: 20, fontWeight: 800, color: "var(--wf-text)", margin: 0 }}>{headerText}</h2>
        
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <div className="wf-tab-group">
            {[{id: "month", label: "Tháng"}, {id: "week", label: "Tuần"}, {id: "day", label: "Ngày"}].map(t => (
              <button key={t.id} onClick={() => setViewMode(t.id)} className={`wf-tab ${viewMode === t.id ? "active" : ""}`} style={{ padding: "6px 14px", borderRadius: 14, border: "none", fontSize: 13, fontWeight: 700, cursor: "pointer", background: viewMode === t.id ? "#8b5cf6" : "transparent", color: viewMode === t.id ? "#fff" : "var(--wf-text-muted)" }}>
                {t.label}
              </button>
            ))}
          </div>

          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={prevTime} className="wf-btn" style={{ background: "var(--wf-hover-soft)", border: "none", borderRadius: 10, padding: "8px 12px", cursor: "pointer", color: "var(--wf-text)" }}><ChevronLeft size={18} /></button>
            <button onClick={() => setCurrentDate(new Date())} className="wf-btn" style={{ background: "var(--wf-hover-soft)", border: "none", borderRadius: 10, padding: "8px 16px", cursor: "pointer", color: "var(--wf-text)", fontWeight: 700 }}>Hôm nay</button>
            <button onClick={nextTime} className="wf-btn" style={{ background: "var(--wf-hover-soft)", border: "none", borderRadius: 10, padding: "8px 12px", cursor: "pointer", color: "var(--wf-text)" }}><ChevronRight size={18} /></button>
          </div>
        </div>
      </div>

      {viewMode === "month" || viewMode === "week" ? (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 8, flex: 1 }}>
          {["CN", "T2", "T3", "T4", "T5", "T6", "T7"].map(d => (
            <div key={d} style={{ textAlign: "center", fontWeight: 800, fontSize: 13, color: "var(--wf-text-muted)", paddingBottom: 10 }}>{d}</div>
          ))}
          {cells.map((dateObj, idx) => {
            if (!dateObj) return <div key={idx} style={{ background: "var(--wf-page-bg)", borderRadius: 12, opacity: 0.4 }} />;
            
            const dStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, "0")}-${String(dateObj.getDate()).padStart(2, "0")}`;
            const isToday = dStr === todayStrLocal;
            const dayTasks = tasks.filter(t => t.due === dStr);
            const isCurrentMonth = dateObj.getMonth() === currentDate.getMonth();
            
            return (
              <div key={idx} style={{ border: isToday ? "2px solid #6366f1" : "1px solid var(--wf-border-soft)", borderRadius: 12, background: isToday ? "rgba(99,102,241,0.05)" : "var(--wf-surface)", padding: "10px 8px", minHeight: viewMode === "week" ? 400 : 110, display: "flex", flexDirection: "column", opacity: isCurrentMonth || viewMode === "week" ? 1 : 0.4 }}>
                <div style={{ fontSize: 14, fontWeight: isToday ? 800 : 700, color: isToday ? "#6366f1" : "var(--wf-text)", marginBottom: 8, textAlign: "right", marginRight: 4 }}>
                  {viewMode === "week" ? `${dateObj.getDate()}/${dateObj.getMonth()+1}` : dateObj.getDate()}
                </div>
                <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 6, overflowY: "auto", overflowX: "hidden" }} className="wf-scrollbar">
                  {dayTasks.map((t, i) => {
                     if (viewMode === "month" && i >= 3) return null;
                     return renderTask(t);
                  })}
                  {viewMode === "month" && dayTasks.length > 3 && (
                    <div style={{ fontSize: 10, color: "var(--wf-text-muted)", textAlign: "center", fontWeight: 700, marginTop: 2, padding: "4px 0", background: "var(--wf-page-bg)", borderRadius: 6, cursor: "pointer" }} onClick={() => {/* có thể hiển thị modal xem thêm */}}>+{dayTasks.length - 3} nữa</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 12 }}>
          {(() => {
            const dateObj = cells[0];
            const dStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, "0")}-${String(dateObj.getDate()).padStart(2, "0")}`;
            const dayTasks = tasks.filter(t => t.due === dStr);
            return (
              <div style={{ padding: 20, border: "1px solid var(--wf-border-soft)", borderRadius: 16, background: "var(--wf-surface)", flex: 1 }}>
                <h3 style={{ margin: "0 0 16px 0", fontSize: 16, color: "var(--wf-text-secondary)" }}>
                  Các công việc trong ngày ({dayTasks.length})
                </h3>
                {dayTasks.length === 0 ? (
                  <div style={{ textAlign: "center", padding: 40, color: "var(--wf-text-faint)" }}>
                    <Calendar size={48} opacity={0.2} style={{ marginBottom: 12 }} />
                    <div>Không có công việc nào trong ngày này</div>
                  </div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {dayTasks.map(t => renderTask(t))}
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

              <div style={{ flex: 1, overflow: "hidden" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                  <div style={{ fontSize: 14, fontWeight: activeChat === t.id ? 800 : 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{t.name}</div>
                  <div style={{ fontSize: 11, color: t.unread > 0 ? "#6366f1" : "var(--wf-text-muted)", fontWeight: t.unread > 0 ? 800 : 600 }}>{t.time}</div>
                </div>
                <div style={{ fontSize: 12.5, color: t.unread > 0 ? "var(--wf-text)" : "var(--wf-text-muted)", fontWeight: t.unread > 0 ? 700 : 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                  {t.lastMsg}
                </div>
              </div>
              {t.unread > 0 && <div style={{ width: 20, height: 20, borderRadius: "50%", background: "#6366f1", color: "#fff", fontSize: 10, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center" }}>{t.unread}</div>}
            </div>
          ))}
        </div>
      </div>

      {/* Cột khung chat */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", background: "var(--wf-surface)" }}>
        {activeThreadInfo ? (
          <>
            <div style={{ padding: "16px 24px", borderBottom: "1px solid var(--wf-border-soft)", display: "flex", alignItems: "center", gap: 12, background: "var(--wf-page-bg)" }}>
              <div style={{ width: 40, height: 40, borderRadius: activeThreadInfo.isGroup ? 12 : "50%", background: activeThreadInfo.avatarColor, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, fontWeight: 800 }}>
                {activeThreadInfo.isGroup ? <Users size={18} /> : activeThreadInfo.name[0]}
              </div>
              <div>
                <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 2 }}>{activeThreadInfo.name}</div>
                <div style={{ fontSize: 12, color: "#10b981", fontWeight: 600 }}>{activeThreadInfo.isGroup ? "3 thành viên" : "Đang hoạt động"}</div>
              </div>
            </div>
            
            <div style={{ flex: 1, overflowY: "auto", padding: 24, display: "flex", flexDirection: "column", gap: 16 }} className="wf-scrollbar">
              {messages.map(m => {
                const isMe = m.senderId === "me";
                return (
                  <div key={m.id} style={{ display: "flex", flexDirection: "column", alignItems: isMe ? "flex-end" : "flex-start" }}>
                    <div style={{ display: "flex", alignItems: "flex-end", gap: 8, maxWidth: "70%", flexDirection: isMe ? "row-reverse" : "row" }}>
                      {!isMe && <div style={{ width: 28, height: 28, borderRadius: "50%", background: activeThreadInfo.avatarColor, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800, flexShrink: 0 }}>{activeThreadInfo.name[0]}</div>}
                      <div style={{ background: isMe ? "linear-gradient(135deg, #6366f1, #8b5cf6)" : "var(--wf-page-bg)", color: isMe ? "#fff" : "var(--wf-text)", padding: "10px 14px", borderRadius: isMe ? "16px 16px 4px 16px" : "16px 16px 16px 4px", fontSize: 13.5, lineHeight: 1.5, border: isMe ? "none" : "1px solid var(--wf-border-soft)" }}>
                        {m.text}
                      </div>
                    </div>
                    <div style={{ fontSize: 10, color: "var(--wf-text-muted)", marginTop: 4, marginleft: isMe ? 0 : 36, marginRight: isMe ? 0 : 0 }}>{m.time}</div>
                  </div>
                );
              })}
            </div>

            <div style={{ padding: 16, borderTop: "1px solid var(--wf-border-soft)", background: "var(--wf-page-bg)" }}>
              <form onSubmit={handleSend} style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <input value={msgInput} onChange={e => setMsgInput(e.target.value)} placeholder="Nhập tin nhắn..." style={{ flex: 1, padding: "12px 16px", borderRadius: 20, border: "1px solid var(--wf-border-soft)", background: "var(--wf-surface)", color: "var(--wf-text)", fontSize: 14, outline: "none" }} />
                <button type="submit" disabled={!msgInput.trim()} style={{ width: 44, height: 44, borderRadius: "50%", background: msgInput.trim() ? "#6366f1" : "var(--wf-hover-soft)", color: msgInput.trim() ? "#fff" : "var(--wf-text-muted)", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: msgInput.trim() ? "pointer" : "not-allowed", transition: "all 0.2s" }}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
              </form>
            </div>
          </>
        ) : (
          <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--wf-text-muted)", fontSize: 14 }}>
            Chọn một cuộc trò chuyện để bắt đầu
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- shared style helpers ----------
const labelStyle = { display: "block", fontSize: 11.5, fontWeight: 700, color: "var(--wf-text-secondary)", margin: "10px 0 5px", letterSpacing: "0.1px" };
const inputStyle = { width: "100%", boxSizing: "border-box", border: "1.5px solid var(--wf-border)", borderRadius: 10, padding: "9px 12px", fontSize: 13, outline: "none", background: "var(--wf-input-bg)", color: "var(--wf-text)" };
const primaryBtnStyle = { background: "linear-gradient(135deg,#6d28d9,#8b5cf6 45%,#c026d3)", color: "#fff", border: "none", borderRadius: 12, padding: "9px 0", fontSize: 12.5, fontWeight: 800, cursor: "pointer", boxShadow: "0 4px 18px rgba(109,40,217,0.42)" };
const secondaryBtnStyle = { background: "rgba(139,92,246,0.09)", color: "#7c3aed", border: "1.5px solid rgba(139,92,246,0.22)", borderRadius: 12, padding: "9px 0", fontSize: 12.5, fontWeight: 700, cursor: "pointer" };
const choiceBtnStyle = (bg) => ({ display: "flex", alignItems: "center", gap: 12, width: "100%", textAlign: "left", border: "1.5px solid var(--wf-border)", borderRadius: 14, padding: 14, marginBottom: 10, background: bg, cursor: "pointer", transition: "box-shadow 0.2s, border-color 0.2s" });
const checkBtnStyle = (done) => ({ width: 20, height: 20, borderRadius: 6, border: done ? "none" : "1.5px solid var(--wf-border)", background: done ? "linear-gradient(135deg,#10b981,#06b6d4)" : "var(--wf-surface)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, boxShadow: done ? "0 2px 8px rgba(16,185,129,0.3)" : "none" });
const badgeStyle = (color) => ({ fontSize: 10.5, fontWeight: 700, color, background: `${color}1f`, border: "none", borderRadius: 10, padding: "5px 10px", cursor: "pointer", whiteSpace: "nowrap" });

function Legend({ color, label, dash }) {
  return <div style={{ display: "flex", alignItems: "center", gap: 5 }}><div style={{ width: 14, height: 0, borderTop: `2px ${dash ? "dashed" : "solid"} ${color}` }} />{label}</div>;
}

const root = createRoot(document.getElementById("root"));
root.render(<RootGate />);
</script>
</body>
</html>
